        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/settings/library:
    get:
      tags: [settings]
      summary: Get all four per-library overrides.
      operationId: getLibraryOverrides
      description: All four libraries in one document, keyed by kind.
      responses:
        "200":
          description: The overrides document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryOverrides"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/settings/library/{kind}:
    put:
      tags: [settings]
      summary: Save one library's override.
      operationId: putLibraryOverride
      description: |
        An all-empty body clears the override (the row is deleted and later
        reads yield fresh defaults).
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MediaKind"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryOverride"
      responses:
        "200":
          description: The saved override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryOverride"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/settings/{section}:
    get:
      tags: [settings]
      summary: Get one settings-section document (merged with defaults).
      operationId: getSettingsSection
      description: |
        The P5 settings shell reads every section through this one endpoint.
        The response is the section document merged with its defaults, so a
        fresh install always returns a complete document. Section documents
        are key/value JSON stored in the `settings` table. Secrets carried by
        a document (connect tokens, import-list API keys) are masked on read
        — only `*_set` presence booleans come back; a blank secret on write
        keeps the stored value.
      parameters:
        - name: section
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SettingsSection"
      responses:
        "200":
          description: The section document with defaults applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsSectionDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [settings]
      summary: Save one settings-section document (full replace).
      operationId: putSettingsSection
      description: |
        Full-document replace: the body must carry the complete document (the
        server does not merge partial documents). Server-side validation
        rejects unknown enum values (kinds, operators, notification kinds)
        with 400. Secrets follow the masked round-trip — an empty value
        keeps the stored secret.
      parameters:
        - name: section
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SettingsSection"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsSectionDocument"
      responses:
        "200":
          description: The saved document (masked secrets, defaults applied).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsSectionDocument"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/settings/tags/{id}/usage:
    get:
      tags: [settings]
      summary: Usage view for one tag (which items carry it).
      operationId: getTagUsage
      description: |
        The Tags section's usage view. TV series are the only tagged entity
        today, so `series` counts series with the tag and `episodes` counts
        the episodes of those series.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The tag's usage counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagUsage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/settings/custom-formats/score:
    post:
      tags: [settings]
      summary: Score a candidate release against the saved custom formats.
      operationId: scoreCustomFormats
      description: |
        Runs the custom-format scorer (parity with Sonarr's CF engine) over
        the saved custom formats from the custom-formats section and returns
        the total score with a per-format breakdown. Disabled formats and
        unmatched rules contribute nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomFormatScoreRequest"
      responses:
        "200":
          description: The score result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomFormatScoreResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/settings/connect/test:
    post:
      tags: [settings]
      summary: Test one notification (fires a test event through the dispatcher).
      operationId: testConnectNotification
      description: |
        Builds the sink from the saved notification with the given id (or an
        inline definition) and dispatches a test event through the
        notification dispatcher. A non-2xx delivery is reported as ok=false
        with the transport error — the endpoint itself answers 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectTestRequest"
      responses:
        "200":
          description: The delivery outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/settings/metadata-source/search:
    post:
      tags: [settings]
      summary: Search through the per-kind provider fallback chain (P5.7).
      operationId: searchMetadataSource
      description: |
        Runs the metadata search for the requested kind through its ordered
        source list (keyed primary → keyless fallback, P5.7). The first
        source that answers with results wins. 503 (with the per-source
        attempt log in the body) only when every configured source failed or
        was unconfigured — so a zero-key install still searches through the
        keyless adapters (TVmaze, Wikidata, MusicBrainz, Open Library).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataSourceSearchRequest"
      responses:
        "200":
          description: Results from the first working source, plus the attempt log.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSourceSearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Every configured source failed (attempts in the body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSourceSearchResult"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/settings/import-lists/import:
    post:
      tags: [settings]
      summary: Run an import list (Trakt list or another Sonarr instance).
      operationId: runImportListImport
      description: |
        Pulls the list from the saved import list (Trakt list URL, or a
        Sonarr instance via its v3 API — the drop-in bridge) and, unless
        dry_run, adds the items to the matching library. Items that already
        exist are reported, not duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRunRequest"
      responses:
        "200":
          description: The per-item import report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          description: The upstream list could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectTestResult"
  /api/v1/dashboard:
    get:
      tags: [dashboard]
      summary: Cross-library overview.
      operationId: getDashboard
      parameters:
        - name: recent
          in: query
          description: Bounds the recent-history / recent-queue feeds (clamped to 1..100).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: The dashboard snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/queue:
    get:
      tags: [queue]
      summary: Full download/import queue (filtered + paginated).
      operationId: listQueue
      description: Every job across all four kinds, in the standard Page envelope.
      parameters:
        - $ref: "#/components/parameters/ListQ"
        - name: kind
          in: query
          description: Restrict to one kind.
          required: false
          schema:
            $ref: "#/components/schemas/MediaKind"
        - name: state
          in: query
          description: Restrict to one job state.
          required: false
          schema:
            $ref: "#/components/schemas/QueueState"
        - $ref: "#/components/parameters/ListPage"
        - $ref: "#/components/parameters/ListPageSize"
      responses:
        "200":
          description: One page of queue items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageQueueItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/queue/{kind}/{parent}/history:
    get:
      tags: [queue]
      summary: One parent's lifecycle history (newest first).
      operationId: queueHistory
      description: A valid-but-empty history is a 200 with null.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MediaKind"
        - name: parent
          in: path
          required: true
          description: The parent id (movie/series/album/author id).
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: limit
          in: query
          description: Max events (clamped to 100).
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The history events, or null when the parent has none.
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: "#/components/schemas/QueueHistoryEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/queue/{kind}/{parent}/grab:
    post:
      tags: [queue]
      summary: Grab a parent's queued jobs (P3 queue actions).
      description: |
        Promotes every queued job for the parent to downloading (the client
        hand-off). Jobs already downloading are left alone; complete/failed
        jobs are not re-grabbable. Returns how many jobs moved.
      operationId: grabQueue
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MediaKind"
        - name: parent
          in: path
          required: true
          description: The parent id (movie/series/album/author id).
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: How many queued jobs moved to downloading.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueGrabResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/queue/{kind}/{parent}:
    delete:
      tags: [queue]
      summary: Remove a parent's queue jobs (P3 queue actions).
      description: Deletes every queue job for the parent, in any state.
      operationId: removeQueue
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MediaKind"
        - name: parent
          in: path
          required: true
          description: The parent id (movie/series/album/author id).
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: How many queue jobs were removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueRemoveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/history:
    get:
      tags: [history]
      summary: Global event feed across all libraries (P3 Activity > History).
      description: |
        Every lifecycle event (added / monitored / searched / download /
        import / ...) across all four kinds, newest first, with the media
        kind + parent id so the UI can deep-link. Filterable by date
        (since, inclusive) and event type (exact match). An empty feed is
        a 200 with [].
      operationId: listGlobalHistory
      parameters:
        - name: since
          in: query
          description: Inclusive lower bound (RFC 3339) on the event time.
          required: false
          schema:
            type: string
            format: date-time
        - name: event
          in: query
          description: Restrict to one event type (exact match, case-insensitive).
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Max events (default 50, clamped to 1..200).
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The matching events, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GlobalHistoryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/blocklist:
    get:
      tags: [blocklist]
      summary: List blocked releases (P3 Activity > Blocklist).
      description: |
        Every blocked (rejected) release, newest first. Filterable by media
        kind (?kind=) and by the media item it belongs to (?parent_id=).
        An empty blocklist is a 200 with [].
      operationId: listBlocklist
      parameters:
        - name: kind
          in: query
          description: Restrict to one media kind.
          required: false
          schema:
            $ref: "#/components/schemas/MediaKind"
        - name: parent_id
          in: query
          description: Restrict to one media item (movie/series/album/author id).
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The blocked releases, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlocklistEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [blocklist]
      summary: Block a release (P3 Activity > Blocklist).
      description: |
        Records a rejected release. kind must be a valid media kind and
        release_title must be non-empty; both are 400 otherwise.
      operationId: addBlocklist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlocklistRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/blocklist/{id}:
    delete:
      tags: [blocklist]
      summary: Unblock a blocked release (P3 Activity > Blocklist).
      operationId: unblockRelease
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204":
          description: Unblocked (no body).
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/wanted:
    get:
      tags: [wanted]
      summary: Global wanted episodes — Missing or Cutoff Unmet (P3).
      description: |
        Server-side filtered + paginated list of the TV episodes the
        libraries want. tab=missing (default) = monitored episodes with no
        file; tab=cutoff = episodes whose current file quality is below the
        series' cutoff. Cutoff defaults to the lowest quality item of the
        series' quality profile (full profile-driven cutoff config lands in
        P5). An empty page is items: [].
      operationId: listWanted
      parameters:
        - name: tab
          in: query
          description: Which wanted set to list.
          required: false
          schema:
            $ref: "#/components/schemas/WantedTab"
        - name: search
          in: query
          description: Case-insensitive substring match on the series title.
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page number (default 1).
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          description: Page size (default 10, max 500).
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: One page of wanted episodes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageWantedItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/wanted/search:
    post:
      tags: [wanted]
      summary: Search All — fan out a search for the tab's wanted episodes (P3).
      description: |
        For every episode in the tab (default missing), ensures a pending
        wanted row (re-requesting the search for cutoff-unmet episodes),
        and records a search-requested history entry per affected series.
        Returns how many episodes are now wanted for the search.
      operationId: searchWanted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WantedSearchRequest"
      responses:
        "200":
          description: How many episodes are now wanted for the search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WantedActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/wanted/unmonitor:
    post:
      tags: [wanted]
      summary: Unmonitor a batch of wanted episodes (P3).
      description: |
        Turns monitoring off for each (series, season, episode) — the same
        effect as toggling each episode individually. Unknown episodes are
        skipped; the count is how many were actually toggled.
      operationId: unmonitorWanted
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WantedUnmonitorRequest"
      responses:
        "200":
          description: How many episodes were unmonitored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WantedActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/import:
    post:
      tags: [import]
      summary: Manually import a wanted episode from a local file (P3).
      description: |
        Phase-1 manual import: the file must exist on the server, the series
        and episode must exist (404 otherwise). It records a manual-import
        history event and satisfies the episode's wanted row (the file is
        considered in place; physical copying/organization lands with the
        media-management work). Other kinds are 400 in this phase (TV only).
      operationId: manualImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualImportRequest"
      responses:
        "200":
          description: The import report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualImportReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The file does not exist on the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/search/movies:
    get:
      tags: [search]
      summary: Search movies via TMDB.
      description: |-
        Free-text TMDB search. A query of the form `tmdb:<id>` (e.g.
        `tmdb:157336`) looks the movie up directly by TMDB id and returns a
        single fully-enriched hit. Badge fields (poster, certification,
        runtime, studio, genres, IMDb link) are enriched from a details
        fetch; a details failure degrades a hit to empty badge fields
        rather than failing the search.
      operationId: searchMovies
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: The enriched movie search hits.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovieSearchHit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/discover/movies:
    get:
      tags: [movies]
      summary: Discover movies (Radarr R3)
      operationId: discoverMovies
      description: |
        The TMDB trending-movies feed (/trending/movie/week) with optional
        genre/year filters — Radarr's Discover. Same enriched MovieSearchHit
        shape as the search endpoint. Without a TMDB key: 503, the same
        reason shape as /api/v1/search/movies.
      parameters:
        - name: page
          in: query
          description: 1-based page (default 1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: genre
          in: query
          description: >-
            Genre name to filter by (e.g. "Action"); resolved to the TMDB
            genre id. Unknown names return 400.
          schema:
            type: string
        - name: year
          in: query
          description: Release year to filter by (0/absent = any).
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: One page of the trending feed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverMovies"
        "400":
          description: Unknown genre name.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/search/tv:
    get:
      tags: [search]
      summary: Search TV series via TVDB (hits carry tvdb_id).
      operationId: searchTV
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: The hits (flat array, provider wire shape).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/search/tv-tmdb:
    get:
      tags: [search]
      summary: Search TV series via TMDB (hits carry tmdb_id).
      operationId: searchTVMDB
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: The hits (flat array, provider wire shape).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/search/artists:
    get:
      tags: [search]
      summary: Search artists via MusicBrainz (keyless, always available).
      operationId: searchArtists
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: The hits (flat array, provider wire shape).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/search/books/authors:
    get:
      tags: [search]
      summary: Search book authors via Open Library (keyless, always available).
      operationId: searchBookAuthors
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: The hits (flat array, provider wire shape).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/search/books/works:
    get:
      tags: [search]
      summary: Search book works via Open Library (keyless, always available).
      operationId: searchBookWorks
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - name: author
          in: query
          description: Restrict works to this author.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The hits (flat array, provider wire shape).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/profiles:
    get:
      tags: [search]
      summary: Built-in quality profiles for one kind.
      operationId: listProfiles
      description: The kind's profiles plus its default, so the add-flow picker can preselect it.
      parameters:
        - name: kind
          in: query
          required: true
          description: Note the plural movies / books (not the singular dashboard kind).
          schema:
            $ref: "#/components/schemas/ProfileKind"
      responses:
        "200":
          description: The profiles and default.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/events:
    get:
      tags: [events]
      summary: Live WebSocket push of queue and history events.
      operationId: events
      description: |
        Hand-rolled WebSocket (gorilla/websocket), not part of the generated
        client. Auth is a bearer token like the REST API, or a token query
        parameter (browsers cannot set headers on a WebSocket handshake).

        The first frame is a hello handshake (payload omitted). Subsequent
        frames carry bus events — queue.updated and history.appended — with
        per-kind payloads declared under components.schemas (QueueUpdated*
        and HistoryAppended*).
      parameters:
        - name: token
          in: query
          required: false
          description: API token (alternative to the Authorization header).
          schema:
            type: string
      responses:
        "101":
          description: WebSocket upgrade (JSON frames per EventFrame).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventFrame"
        "401":
          description: Missing or invalid token (before upgrade).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus scrape (auth-gated).
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/calendar:
    get:
      tags: [calendar]
      summary: Upcoming monitored air dates (tv) or release dates (movie) in [start, end].
      description: kind=tv (the default) is the Sonarr P4 behavior, unchanged.
        Monitored episodes whose provider air date falls within the window and
        is in the future (today or later). kind=movie (Radarr R4) lists
        monitored movies whose release date falls within the window and is not
        in the past. A missing or invalid start/end falls back to today ..
        today+30d. An empty window returns [].
      operationId: listCalendar
      security: [bearerAuth: []]
      parameters:
        - name: kind
          in: query
          required: false
          description: Calendar kind. tv (default) or movie (R4 movie calendar).
          schema:
            type: string
            enum: [tv, movie]
            default: tv
        - name: start
          in: query
          required: false
          description: Window start (RFC3339). Defaults to today (start of day).
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: false
          description: Window end (RFC3339). Defaults to start + 30 days.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The upcoming calendar entries for the window.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEntry'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
  /calendar.ics:
    get:
      tags: [calendar]
      summary: iCal feed of the upcoming monitored air dates (tv) or release dates (movie).
      description: RFC 5545 iCal document (a VCALENDAR wrapper with a VEVENT
        per entry) for importing into Google/Apple Calendar. kind=tv (the
        default) keeps the P4 episode feed. kind=movie (Radarr R4) emits an
        all-day VEVENT per movie on its release date, SUMMARY "Title (Year)".
        Auth via the app's bearer token, sent either as a standard
        Authorization header or a ?token= query param (the latter so a plain
        calendar-client / <a> link works).
      operationId: calendarFeed
      security: [bearerAuth: []]
      parameters:
        - name: kind
          in: query
          required: false
          description: Calendar kind. tv (default) or movie (R4 movie calendar).
          schema:
            type: string
            enum: [tv, movie]
            default: tv
        - name: token
          in: query
          required: false
          description: Bearer token (alternative to the Authorization header).
          schema:
            type: string
        - name: start
          in: query
          required: false
          description: Window start (RFC3339). Defaults to today.
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: false
          description: Window end (RFC3339). Defaults to start + 30 days.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The iCal feed (RFC 5545).
          content:
            text/calendar:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/system/health:
    get:
      tags: [system]
      summary: Structured health checks for the Status page.
      operationId: getSystemHealth
      description: |
        The structured health table behind System > Status: one row per check
        with a human message, a severity (ok | warning | error) and a wiki
        link. The top-level ok/warning/error counts feed the System nav badge
        (the number of non-ok checks).
      responses:
        '200':
          description: The health table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/system/tasks:
    get:
      tags: [system]
      summary: Running and scheduled background tasks (the worker inventory).
      operationId: getSystemTasks
      description: |
        The task inventory behind System > Tasks. Every supervised worker
        (PLAN.md §3) is exposed here with its schedule, last-run state and
        running flag, plus the planned-but-not-yet-implemented workers.
      responses:
        '200':
          description: The task inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemTasks'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/system/disk:
    get:
      tags: [system]
      summary: Disk space for the configured media roots.
      operationId: getSystemDisk
      description: |
        Disk usage for the configured media roots (System > Status > Disk
        Space): the shared media root, the downloads dir and any registered
        root folders, each with total/used/free bytes and a usage percentage.
      responses:
        '200':
          description: The disk usage report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemDisk'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/system/about:
    get:
      tags: [system]
      summary: Build info, run mode and uptime (System > Status > About).
      operationId: getSystemAbout
      description: Version, commit, build time, Go version, run mode and
        process uptime for the About card.
      responses:
        '200':
          description: The about report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemAbout'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/system/backup:
    get:
      tags: [system]
      summary: Export the configuration as a JSON backup document.
      operationId: getSystemBackup
      description: |
        Exports the settings (download client, library overrides and every
        settings section) as a self-contained JSON backup document. The
        include_queue / include_series query params add optional queue and
        series snapshots.
      parameters:
        - name: include_queue
          in: query
          required: false
          description: Include a queue snapshot.
          schema:
            type: boolean
        - name: include_series
          in: query
          required: false
          description: Include a series snapshot.
          schema:
            type: boolean
      responses:
        '200':
          description: The backup document (downloaded by the UI).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDocument'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      tags: [system]
      summary: Import a configuration backup document.
      operationId: putSystemBackup
      description: |
        Imports a backup document produced by GET /api/v1/system/backup,
        writing the settings back (and, when present and requested, the queue
        and series snapshots). Idempotent: re-importing the same document
        converges to the same state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupImportRequest'
      responses:
        '200':
          description: The import report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupImportResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/system/events:
    get:
      tags: [system]
      summary: The event log (the history source) for System > Events.
      operationId: getSystemEvents
      description: |
        Reads the global history feed — the same source the Activity > History
        page uses — so the Events page can show every lifecycle event with a
        date / event-type filter.
      parameters:
        - name: since
          in: query
          required: false
          description: Inclusive lower bound on the event time (RFC3339).
          schema:
            type: string
            format: date-time
        - name: event
          in: query
          required: false
          description: Exact (case-insensitive) event-type match.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Max rows (clamped to 1..200).
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: The event log, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemEvents'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/system/updates:
    get:
      tags: [system]
      summary: The changelog (System > Updates).
      operationId: getSystemUpdates
      description: The release changelog with the current running version
        highlighted.
      responses:
        '200':
          description: The changelog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUpdates'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/system/logs:
    get:
      tags: [system]
      summary: Streaming log viewer (System > Log Files) over SSE.
      operationId: getSystemLogs
      description: |
        A Server-Sent-Events stream of recent application log lines. The first
        frame is a `level`-tagged backlog of the ring buffer, then live lines
        are pushed as they occur (flushed per event). Content-Type is
        text/event-stream, not JSON.
      responses:
        '200':
          description: The SSE log stream.
          content:
            text/event-stream:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/system/migration:
    post:
      tags: [system]
      summary: Run the Sonarr drop-in migration.
      operationId: runMigration
      description: |
        The drop-in moment: pulls a live Sonarr instance (series +
        seasons/episodes + quality profiles + tags + indexers + download
        client) via its v3 API and imports it into Mediarr, returning a
        mapping report. dry_run reports what would be imported without
        writing; the run is idempotent (re-runnable, no duplicates) and
        resumable (a partial run can be continued).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationRequest'
      responses:
        '200':
          description: The mapping report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '500': { $ref: '#/components/responses/Internal' }
  /api/v1/system/migration/status:
    get:
      tags: [system]
      summary: Migration progress and last result.
      operationId: getMigrationStatus
      description: Current migration status (idle / running / completed /
        partial / failed) with a progress counter and the last mapping report.
      responses:
        '200':
          description: The migration status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token minted by POST /api/v1/auth/login.
  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathEditionID:
      name: editionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathSeason:
      name: season
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PathEpisode:
      name: episode
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PathDisc:
      name: disc
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PathNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ListQ:
      name: q
      in: query
      required: false
      description: Case-insensitive substring search on the item name.
      schema:
        type: string
    ListMonitored:
      name: monitored
      in: query
      required: false
      description: When set (true or false), keep only items whose monitored flag matches.
      schema:
        type: boolean
    ListPage:
      name: page
      in: query
      required: false
      description: 1-based page number (default 1).
      schema:
        type: integer
        minimum: 1
    ListPageSize:
      name: page_size
      in: query
      required: false
      description: Page size (default 25, max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
    HistoryLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of entries to return (server clamps to 1..200, default 50).
      schema:
        type: integer
        minimum: 1
        default: 50
    SearchQuery:
      name: query
      in: query
      required: true
      description: Free-text search query.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid input (bad JSON, missing field, bad path/query value).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Duplicate resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Upstream provider returned a bad answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Provider not configured (missing API key).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    VersionInfo:
      type: object
      required: [version, commit, build_time, go_version, started_at]
      properties:
        version:
          type: string
        commit:
          type: string
        build_time:
          type: string
        go_version:
          type: string
        started_at:
          type: string
          format: date-time
    ReadinessCheck:
      type: object
      required: [name, ok]
      properties:
        name:
          type: string
        ok:
          type: boolean
        latency:
          type: string
        error:
          type: string
    ReadinessReport:
      type: object
      required: [status, checks, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"
        version:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      required: [token, user, role, token_prefix]
      properties:
        token:
          type: string
        user:
          type: string
        role:
          type: string
        token_prefix:
          type: string
    Me:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
        role:
          type: string
    PageMovie:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer
    PageSeries:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Series"
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer
    PageArtist:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Artist"
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer
    PageAuthor:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Author"
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer
    PageQueueItem:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueViewItem"
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer
    AddedId:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
    MonitoredResult:
      type: object
      required: [id, monitored]
      properties:
        id:
          type: integer
          format: int64
        monitored:
          type: boolean
    SetMonitored:
      type: object
      required: [monitored]
      properties:
        monitored:
          type: boolean
    SeasonMonitoredResult:
      type: object
      required: [season, monitored]
      properties:
        season:
          type: integer
        monitored:
          type: boolean
    EpisodeMonitoredResult:
      type: object
      required: [season, episode, monitored]
      properties:
        season:
          type: integer
        episode:
          type: integer
        monitored:
          type: boolean
    TrackMonitoredResult:
      type: object
      required: [disc, number, monitored]
      properties:
        disc:
          type: integer
        number:
          type: integer
        monitored:
          type: boolean
    ImportedResult:
      type: object
      required: [imported]
      properties:
        imported:
          type: integer
    Movie:
      type: object
      required: [ID, Title, Year, QualityProfile, Monitored, AddedAt]
      properties:
        ID:
          type: integer
          format: int64
        Title:
          type: string
        Year:
          type: integer
        QualityProfile:
          type: string
        Monitored:
          type: boolean
        AddedAt:
          type: string
          format: date-time
        # R2 add-flow fields (Radarr parity). Stored on the movie; empty when
        # unset (the pre-R2 add flow predates them).
        Tags:
          type: array
          items:
            type: string
          description: Free-form movie tags (R2); empty when unset.
        RootFolder:
          type: string
          description: Root folder path for the movie's files (R2); '' when unset (server default).
        MinimumAvailability:
          $ref: "#/components/schemas/MovieMinimumAvailability"
        # R1 enrichment (Radarr parity). Display-only fields sourced from the
        # metadata provider (TMDB): null/empty when the provider is unconfigured
        # or the lookup failed — the UI renders em-dashes, never an error.
        Certification:
          type: string
          nullable: true
          description: Age rating (e.g. PG-13); null when unknown.
        Runtime:
          type: integer
          nullable: true
          description: Runtime in minutes; null when unknown.
        Studio:
          type: string
          nullable: true
          description: Primary production company; null when unknown.
        Genres:
          type: array
          items:
            type: string
          description: Genre names; empty when unknown.
        OriginalLanguage:
          type: string
          nullable: true
          description: ISO language code (e.g. en); null when unknown.
        CollectionName:
          type: string
          nullable: true
          description: Franchise/collection name; null when none.
        CollectionID:
          type: string
          nullable: true
          description: >-
            TMDB collection id when the movie belongs to one (persisted by
            the enricher, Radarr R3); null/"" when unknown. The collections
            page groups library movies by this.
        ReleaseDate:
          type: string
          description: >-
            Provider release date, "YYYY-MM-DD" (persisted by the enricher,
            Radarr R4); "" when unknown (keyless dev). Feeds the movie
            calendar and the "unreleased" status.
        Overview:
          type: string
          nullable: true
          description: Plot overview; null when unknown.
        Scores:
          $ref: "#/components/schemas/MovieScores"
        Cast:
          type: array
          items:
            $ref: "#/components/schemas/MovieCast"
          description: Top cast (name + role); empty when unknown.
        Crew:
          type: array
          items:
            $ref: "#/components/schemas/MovieCrew"
          description: Key crew (name + job); empty when unknown.
        AlternativeTitles:
          type: array
          items:
            $ref: "#/components/schemas/AlternativeTitle"
          description: Also-known-as titles; empty when none.
        # R1 file/edition state (Radarr embeds files in the movie object).
        Path:
          type: string
          nullable: true
          description: Relative file path under the media root when a file is imported; null when no file.
        Status:
          $ref: "#/components/schemas/MovieStatus"
        Size:
          type: integer
          format: int64
          nullable: true
          description: Total bytes of the movie's files; null when no file.
        Editions:
          type: array
          items:
            $ref: "#/components/schemas/MovieEdition"
          description: The movie's editions (one, 'Theatrical', seeded on add).
        Files:
          type: array
          items:
            $ref: "#/components/schemas/MovieFile"
          description: The movie's files; empty until imported.
    MovieCollection:
      type: object
      required: [id, name, movie_count, missing_count, movies]
      description: |
        A library view of one TMDB collection (Radarr R3 Collections page).
        `id` is the TMDB collection id, or "unknown" when the library only
        knows the collection by name (no id persisted). `movie_count` is the
        number of library members (the `movies` array); `missing_count` is
        the number of collection parts that are not in the library, fetched
        best-effort from TMDB (0 when the collection id is unknown or TMDB is
        unavailable — keyless dev still groups by name).
      properties:
        id:
          type: string
        name:
          type: string
          description: Collection name; "" when unknown (UI shows "Unknown").
        movie_count:
          type: integer
          description: Number of library members.
        missing_count:
          type: integer
          description: Collection parts not in the library (best-effort).
        movies:
          type: array
          items:
            $ref: "#/components/schemas/Movie"
          description: The library members as full Movie objects.
    DiscoverMovies:
      type: object
      required: [results, page, total]
      description: |
        One page of the Discover feed (Radarr R3): the TMDB trending-movies
        feed with optional genre/year filters. `results` carries the same
        enriched MovieSearchHit shape as the search endpoint (badges included).
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/MovieSearchHit"
        page:
          type: integer
          description: The (1-based) page that was fetched.
        total:
          type: integer
          description: TMDB's total_results for the active filter.
    MovieStatus:
      type: string
      description: |
        Derived status of a movie (Radarr v6 status chips). Derivation
        (in order): downloaded when the wanted row is satisfied (split by the
        monitored flag); queued when an active queue entry exists; unreleased
        when the provider release date is in the future; otherwise missing
        (split by the monitored flag).
      enum:
        - "downloaded:monitored"
        - "downloaded:unmonitored"
        - "missing:monitored"
        - "missing:unmonitored"
        - queued
        - unreleased
    MovieScores:
      type: object
      nullable: true
      description: External scores; the whole object is null until a metadata provider fills it.
      properties:
        TmdbPct:
          type: number
          nullable: true
          description: TMDB vote average scaled to 0-100.
        Imdb:
          type: number
          nullable: true
          description: IMDb rating (0-10 scale).
        RottenTomatoes:
          type: number
          nullable: true
          description: Rotten Tomatoes Tomatometer (0-100).
        Metacritic:
          type: number
          nullable: true
          description: Metacritic score (0-100).
    MovieCast:
      type: object
      required: [Name, Role]
      properties:
        Name:
          type: string
        Role:
          type: string
          description: Character played; empty when unknown.
    MovieCrew:
      type: object
      required: [Name, Job]
      properties:
        Name:
          type: string
        Job:
          type: string
          description: Crew job (director, screenwriter, ...).
    AlternativeTitle:
      type: object
      required: [Title, Type]
      properties:
        Title:
          type: string
        Type:
          type: string
          description: Source of the alternative title; empty when unknown.
    MovieEdition:
      type: object
      required: [ID, Label, Monitored, Quality, Size]
      description: |
        A distinct edition of a movie (Radarr v6 editions: theatrical,
        extended, ...). A freshly added movie gets one 'Theatrical' edition
        monitored with the movie's quality profile.
      properties:
        ID:
          type: integer
          format: int64
        Label:
          type: string
          description: Edition label (e.g. Theatrical).
        Monitored:
          type: boolean
        Quality:
          type: string
          description: Quality profile name for this edition.
        Size:
          type: integer
          format: int64
          description: Total bytes of the edition's files; 0 when none.
    MovieFile:
      type: object
      required: [RelativePath, Size, Languages, Quality]
      description: An imported movie file (Radarr v6 movie-file shape).
      properties:
        RelativePath:
          type: string
          description: Path of the file relative to the media root.
        VideoCodec:
          type: string
          description: Detected video codec (h264/h265/...); empty when unknown.
        AudioInfo:
          type: string
          description: Audio summary (codec/language/channels); empty when unknown.
        Size:
          type: integer
          format: int64
        Languages:
          type: array
          items:
            type: string
          description: Language codes found in the release; empty when unknown.
        Quality:
          type: string
          description: Parsed quality label (e.g. 1080p).
        ReleaseGroup:
          type: string
          description: Releasing group; empty when unknown.
        Formats:
          type: array
          items:
            type: string
          description: Format tags (WEB-DL, BluRay, ...); empty when unknown.
    MovieStats:
      type: object
      required: [MovieCount, FileCount, MonitoredCount, UnmonitoredCount, TotalSize]
      description: Library stats bar (Movies page).
      properties:
        MovieCount:
          type: integer
          format: int64
        FileCount:
          type: integer
          format: int64
        MonitoredCount:
          type: integer
          format: int64
        UnmonitoredCount:
          type: integer
          format: int64
        TotalSize:
          type: integer
          format: int64
          description: Total bytes across all movie files.
    AddMovieRequest:
      type: object
      description: |-
        Add a movie. Omitted optional fields default: monitor=all, no minimum
        availability, no tags, server default root folder, no search.
      required: [title]
      properties:
        title:
          type: string
        year:
          type: string
        quality_profile:
          type: string
        monitor:
          type: string
          description: |-
            Edition-aware monitor mode (Radarr R2). all = movie + every edition
            monitored; movie_only = movie monitored, editions unmonitored;
            unmonitored = nothing monitored; all_except_3d = everything
            monitored except editions whose label contains '3D'.
          enum: [all, movie_only, unmonitored, all_except_3d]
        minimum_availability:
          type: string
          description: Minimum availability before a search may pull the movie (Radarr R2); omitted = released (default).
          enum: [announced, posters, in_production, released]
          default: released
        tags:
          type: array
          description: Free-form movie tags (Radarr R2); omitted = none.
          items:
            type: string
        root_folder:
          type: string
          description: Root folder path for the movie's files (Radarr R2); empty = server default.
        start_search:
          type: boolean
          description: Start a search for the movie after adding (Radarr R2); best-effort — a pipeline failure is recorded, never an add failure.
          default: false
    Series:
      type: object
      required: [ID, TVDBID, TMDBID, Title, Year, QualityProfile, Monitored, SeriesType, SeasonFolder, Tags, AddedAt]
      properties:
        ID:
          type: integer
          format: int64
        TVDBID:
          type: integer
