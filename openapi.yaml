        SeasonFolder:
          type: boolean
          description: Organize files under a per-season folder (P2); defaults to false.
        Tags:
          type: array
          items:
            type: string
          description: Free-form series tags (P2); empty when unset.
        AddedAt:
          type: string
          format: date-time
    AddSeriesRequest:
      type: object
