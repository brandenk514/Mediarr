        Files:
          type: integer
          description: Number of video files under the folder.
        Size:
          type: integer
          format: int64
          description: Total bytes of those video files.
        Matched:
          type: boolean
          description: A tracked series was found for this folder.
        SeriesID:
          type: integer
          format: int64
