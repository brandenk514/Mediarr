      summary: Create an indexer.
      operationId: createIndexer
      description: |
        api_key is plaintext in the request but never echoed back. An empty
        api_key is legal (keyless indexers). kind must be one this build can
        materialize (currently fake, torznab, torrent-rss, nzb); unknown
        kinds are 400. A duplicate name is 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndexerCreate"
      responses:
        "201":
          description: Created.
          content:
