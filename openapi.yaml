          format: date-time
    BlocklistEntry:
      type: object
      required: [id, kind, parent_id, parent_name, release_title, indexer, reason, created_at]
      description: A blocked (rejected) release in Activity > Blocklist.
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/MediaKind"
        parent_id:
          type: integer
          format: int64
          description: The media item id the release belonged to.
        parent_name:
          type: string
          description: Display name of the media item.
        release_title:
          type: string
        indexer:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
    BlocklistRequest:
      type: object
      required: [kind, release_title]
      properties:
        kind:
          $ref: "#/components/schemas/MediaKind"
        parent_id:
          type: integer
          format: int64
        release_title:
          type: string
        indexer:
          type: string
        reason:
          type: string
    WantedTab:
      type: string
      enum: [missing, cutoff]
      description: missing = monitored, no file; cutoff = file below the series cutoff.
    WantedItem:
      type: object
      required: [kind, series_id, series_title, season, episode, episode_title, air_date, status]
      description: One episode in the global Wanted table (a row is always TV).
      properties:
        kind:
          type: string
          enum: [tv]
        series_id:
          type: integer
          format: int64
        series_title:
          type: string
        season:
          type: integer
        episode:
          type: integer
        episode_title:
          type: string
        air_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
          description: 'Why the episode is wanted (missing: or cutoff: prefix + detail).'
    PageWantedItem:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WantedItem"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    CalendarEntry:
      type: object
      required: [kind, series_id, series_title, season, episode, episode_title, sxe, air_start, air_end]
      properties:
        kind:
          type: string
          enum: [tv, movie]
        series_id:
          type: integer
          format: int64
          description: The series id (kind=tv) or the movie id (kind=movie).
        series_title:
          type: string
          description: The show title (kind=tv) or the movie title (kind=movie).
        season:
          type: integer
        episode:
          type: integer
        episode_title:
          type: string
        sxe:
          type: string
          description: Absolute SxE, e.g. "S1E05".
        air_date:
          type: string
          format: date
          nullable: true
          description: The (date-only) air date from provider metadata.
        air_start:
          type: string
          format: date-time
          description: Derived air start (air date at the default air time).
        air_end:
          type: string
          format: date-time
          description: Derived air end (air start + the default runtime).
          # R4 (movie calendar). The movie variant's identifying extras;
          # omitted on TV entries (the TV wire shape is byte-compatible).
        year:
          type: integer
          nullable: true
          description: The movie's year (kind=movie only; omitted on TV entries).
        status:
          type: string
          nullable: true
          description: The movie's derived status (kind=movie only; omitted on TV entries).
        quality_profile:
          type: string
          nullable: true
          description: The movie's quality profile name (kind=movie only; omitted on TV entries).
    WantedSearchRequest:
      type: object
      properties:
        tab:
          default: missing
          $ref: "#/components/schemas/WantedTab"
    WantedEpisodeRef:
      type: object
      required: [series_id, season, episode]
      properties:
        series_id:
          type: integer
          format: int64
        season:
          type: integer
        episode:
          type: integer
    WantedUnmonitorRequest:
      type: object
      required: [episodes]
      properties:
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/WantedEpisodeRef"
    WantedActionResult:
      type: object
      description: Result of a Search All (searched) or Unmonitor (unmonitored) action.
      properties:
        searched:
          type: integer
          description: How many episodes were sent to search (Search All).
        unmonitored:
          type: integer
          description: How many episodes had monitoring turned off (Unmonitor).
    ManualImportRequest:
      type: object
      required: [kind, series_id, season, episode, file_path]
      properties:
        kind:
          $ref: "#/components/schemas/MediaKind"
        series_id:
          type: integer
          format: int64
        season:
          type: integer
        episode:
          type: integer
        file_path:
          type: string
          description: Server-side path of the episode file to import.
        release_title:
          type: string
          description: Optional release name recorded in history.
    ManualImportReport:
      type: object
      required: [imported, message]
      properties:
        imported:
          type: boolean
        message:
          type: string
    QueueGrabResult:
      type: object
      required: [grabbed]
      properties:
        grabbed:
          type: integer
          description: How many queued jobs moved to downloading.
    QueueRemoveResult:
      type: object
      required: [removed]
      properties:
        removed:
          type: integer
          description: How many queue jobs were removed.
    Indexer:
      type: object
      required: [id, name, kind, base_url, enabled, has_api_key, last_test]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          description: Indexer protocol (fake, torznab, torrent-rss, nzb).
        base_url:
          type: string
        enabled:
          type: boolean
        has_api_key:
          type: boolean
          description: Presence flag only — the key itself is never returned.
        last_test:
          type: string
          format: date-time
          nullable: true
    IndexerCreate:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          description: Indexer protocol (fake, torznab, torrent-rss, nzb).
        base_url:
          type: string
        api_key:
          type: string
          description: Plaintext in the request; never echoed back. Empty = keyless.
        settings_json:
          type: string
          description: Adapter-specific JSON config (defaults to {}).
        enabled:
          type: boolean
          description: Omitted = enabled (default).
    IndexerUpdate:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          description: Indexer protocol (fake, torznab, torrent-rss, nzb).
        base_url:
          type: string
        api_key:
          type: string
          description: Empty = keep the stored key (masked-edit round-trip).
        settings_json:
          type: string
          description: Empty = keep the stored settings.
    IndexerEnabled:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    IndexerTestResult:
      type: object
      required: [id, name, kind, base_url, enabled, ok, duration, at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
        base_url:
          type: string
        enabled:
          type: boolean
        ok:
          type: boolean
        error:
          type: string
          description: Credential-free failure reason (absent on success).
        duration:
          type: integer
          description: Probe duration in nanoseconds.
        at:
          type: string
          format: date-time
    IndexerStats:
      type: object
      required: [name, calls, successes, failures, last_success, last_error, last_latency_ns, avg_latency_ns, total_latency_ns]
      properties:
        name:
          type: string
        calls:
          type: integer
          format: int64
        successes:
          type: integer
          format: int64
        failures:
          type: integer
          format: int64
        last_success:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
        last_latency_ns:
          type: integer
          format: int64
        avg_latency_ns:
          type: integer
          format: int64
        total_latency_ns:
          type: integer
          format: int64
    DownloadClientView:
      type: object
      required: [kind, qb_base, qb_username, qb_api_key_set, qb_password_set, sab_base, sab_api_key_set, sab_complete_dir]
      properties:
        kind:
          type: string
          description: Download-client kind (mock, qbittorrent, sabnzbd).
        qb_base:
          type: string
        qb_username:
          type: string
        qb_api_key_set:
          type: boolean
        qb_password_set:
          type: boolean
        sab_base:
          type: string
        sab_api_key_set:
          type: boolean
        sab_complete_dir:
          type: string
    DownloadClientRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: Download-client kind (mock, qbittorrent, sabnzbd); omitted means mock.
        qb_base:
          type: string
        qb_username:
          type: string
        qb_api_key:
          type: string
          description: Empty = keep the stored value.
        qb_password:
          type: string
          description: Empty = keep the stored value.
        sab_base:
          type: string
        sab_api_key:
          type: string
          description: Empty = keep the stored value.
        sab_complete_dir:
          type: string
    LibraryOverride:
      type: object
      required: [path, quality_profile]
      properties:
        path:
          type: string
        quality_profile:
          type: string
        checksum_verify:
          type: boolean
          nullable: true
          description: Tristate — absent/null means use the default; false opts out, true opts in.
    LibraryOverrides:
      type: object
      description: All four libraries keyed by kind (movie, tv, music, book).
      additionalProperties:
        $ref: "#/components/schemas/LibraryOverride"
    SearchResult:
      type: object
      required: [id, title, year, extra]
      properties:
        id:
          type: string
          description: Provider id (tmdb_id / tvdb_id / mbid / open-library key).
        title:
          type: string
        year:
          type: integer
        extra:
          type: object
          description: Display-only detail per kind (overview+rating, country, author).
          additionalProperties:
            type: string
    MovieSearchHit:
      type: object
      description: |-
        One enriched movie search hit for the add flow (Radarr R2). Badge
        fields degrade to empty/zero when the TMDB details fetch failed;
        `tmdb_pct` is null when the movie has no TMDB vote.
      required:
        [id, title, year, poster, overview, certification, runtime, original_language, studio, genres, tmdb_pct, imdb, links]
      properties:
        id:
          type: string
          description: TMDB id.
        title:
          type: string
        year:
          type: integer
          description: Release year (0 when unknown).
        poster:
          type: string
          description: Poster image URL; '' when unknown.
        overview:
          type: string
          description: Plot synopsis; '' when unknown.
        certification:
          type: string
          description: US MPAA rating when available (e.g. 'PG-13').
        runtime:
          type: integer
          description: Runtime in minutes; 0 when unknown.
        original_language:
          type: string
          description: ISO 639-1 language code (e.g. 'en').
        studio:
          type: string
        genres:
          type: array
          items:
            type: string
        tmdb_pct:
          type: number
          nullable: true
          description: TMDB vote average scaled to 0-100; null when unknown.
        imdb:
          type: string
          description: IMDb URL; '' when unknown.
        links:
          type: object
          required: [tmdb]
          properties:
            tmdb:
              type: string
              description: Canonical TMDB page URL.
    MovieMinimumAvailability:
      type: string
      description: |-
        Minimum availability before a movie may be searched (Radarr R2).
        Empty string when unset.
      enum: [announced, posters, in_production, released, '']
    ProfileKind:
      type: string
      enum: [movies, tv, music, books]
    ProfilesResponse:
      type: object
      required: [profiles, default]
      properties:
        profiles:
          type: array
          items:
            type: string
        default:
          type: string
    EventFrame:
      type: object
      required: [type, at]
      properties:
        type:
          type: string
          description: Frame type — hello, queue.updated, or history.appended.
        payload:
          $ref: "#/components/schemas/EventPayload"
        at:
          type: string
          format: date-time
    EventPayload:
      description: |
        Per-kind bus payloads. queue.updated and history.appended frames carry
        one of these; the id field identifies the kind (movie_id, series_id,
        artist_id, or author_id).
      oneOf:
        - $ref: "#/components/schemas/QueueUpdatedMovie"
        - $ref: "#/components/schemas/QueueUpdatedTV"
        - $ref: "#/components/schemas/QueueUpdatedMusic"
        - $ref: "#/components/schemas/QueueUpdatedBook"
        - $ref: "#/components/schemas/HistoryAppendedMovie"
        - $ref: "#/components/schemas/HistoryAppendedTV"
        - $ref: "#/components/schemas/HistoryAppendedMusic"
        - $ref: "#/components/schemas/HistoryAppendedBook"
    QueueUpdatedMovie:
      type: object
      required: [movie_id, queue_id, release_title, indexer, client, state, progress]
      properties:
        movie_id:
          type: integer
          format: int64
        queue_id:
          type: integer
          format: int64
        release_title:
          type: string
        indexer:
          type: string
        client:
          type: string
        state:
          $ref: "#/components/schemas/QueueState"
        progress:
          type: integer
    QueueUpdatedTV:
      type: object
      required: [series_id, queue_id, release_title, indexer, client, state, progress]
      properties:
        series_id:
          type: integer
          format: int64
        queue_id:
          type: integer
          format: int64
        release_title:
          type: string
        indexer:
          type: string
        client:
          type: string
        state:
          $ref: "#/components/schemas/QueueState"
        progress:
          type: integer
    QueueUpdatedMusic:
      type: object
      required: [artist_id, album_id, queue_id, release_title, indexer, client, state, progress]
      properties:
        artist_id:
          type: integer
          format: int64
        album_id:
          type: integer
          format: int64
        queue_id:
          type: integer
          format: int64
        release_title:
          type: string
        indexer:
          type: string
        client:
          type: string
        state:
          $ref: "#/components/schemas/QueueState"
        progress:
          type: integer
    QueueUpdatedBook:
      type: object
      required: [author_id, title_id, queue_id, release_title, indexer, client, state, progress]
      properties:
        author_id:
          type: integer
          format: int64
        title_id:
          type: integer
          format: int64
        queue_id:
          type: integer
          format: int64
        release_title:
          type: string
        indexer:
          type: string
        client:
          type: string
        state:
          $ref: "#/components/schemas/QueueState"
        progress:
          type: integer
    HistoryAppendedMovie:
      type: object
      required: [movie_id, event, detail]
      properties:
        movie_id:
          type: integer
          format: int64
        event:
          type: string
        detail:
          type: string
    HistoryAppendedTV:
      type: object
      required: [series_id, event, detail]
      properties:
        series_id:
          type: integer
          format: int64
        event:
          type: string
        detail:
          type: string
    HistoryAppendedMusic:
      type: object
      required: [artist_id, event, detail]
      properties:
        artist_id:
          type: integer
          format: int64
        event:
          type: string
        detail:
          type: string
    HistoryAppendedBook:
      type: object
      required: [author_id, event, detail]
      properties:
        author_id:
          type: integer
          format: int64
        event:
          type: string
        detail:
          type: string
    # ---- P5 settings sections (the 13-section settings IA) ----
    SettingsSection:
      type: string
      description: The generic per-section slugs (indexers and download-clients keep their dedicated endpoints).
      enum:
        - general
        - ui
        - quality
        - profiles
        - tags
        - media-management
        - custom-formats
        - connect
        - metadata
        - metadata-source
        - import-lists
    SettingsSectionDocument:
      oneOf:
        - $ref: "#/components/schemas/GeneralSettings"
        - $ref: "#/components/schemas/UISettings"
        - $ref: "#/components/schemas/QualitySettings"
        - $ref: "#/components/schemas/ProfilesSettings"
        - $ref: "#/components/schemas/TagsSettings"
        - $ref: "#/components/schemas/MediaManagementSettings"
        - $ref: "#/components/schemas/CustomFormatsSettings"
        - $ref: "#/components/schemas/ConnectSettings"
        - $ref: "#/components/schemas/MetadataSettings"
        - $ref: "#/components/schemas/MetadataSourceSettings"
        - $ref: "#/components/schemas/ImportListsSettings"
    GeneralSettings:
      type: object
      description: |
        App-level settings, reconciled with the env-based boot config.
        host/port/base_url/ssl are persisted here for display and for the
        next boot; auth_enabled/auth_pinning take effect at next boot.
      required: [host, port, base_url, ssl, auth_enabled, auth_pinning]
      properties:
        host:
          type: string
        port:
          type: integer
        base_url:
          type: string
        ssl:
          type: boolean
        auth_enabled:
          type: boolean
        auth_pinning:
          type: boolean
    UISettings:
      type: object
      required: [default_view, date_format, time_format, items_per_page]
      properties:
        default_view:
          type: string
          enum: [dashboard, calendar, queue, wanted, series, movies, artists, authors]
        date_format:
          type: string
        time_format:
          type: string
          enum: ["24h", "12h"]
        items_per_page:
          type: integer
    QualityLevel:
      type: object
      required: [id, name, source, resolution, size_limit_mb]
      properties:
        id:
          type: integer
        name:
          type: string
        source:
          type: string
        resolution:
          type: string
        size_limit_mb:
          type: integer
          description: "0 = unlimited."
    QualitySettings:
      type: object
      required: [levels, movie_levels]
      properties:
        levels:
          type: array
          items:
            $ref: "#/components/schemas/QualityLevel"
        movie_levels:
          type: array
          description: |
            Radarr movie quality definitions (Radarr R5a). A separate ID
            space from the TV levels, starting at 100, so movie quality
            profile items can't collide with TV level ids.
          items:
            $ref: "#/components/schemas/QualityLevel"
    QualityProfileItem:
      type: object
      required: [quality, approved]
      properties:
        quality:
          type: integer
          description: QualityLevel id.
        approved:
          type: boolean
    QualityProfile:
      type: object
      required: [id, name, items, cutoff]
      properties:
        id:
          type: integer
        name:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/QualityProfileItem"
        cutoff:
          type: integer
          description: QualityLevel id that triggers a re-download when exceeded.
    DelayProfile:
      type: object
      description: |
        Search delay per release source, in hours (Radarr R5a; Radarr's
        delay profiles). 0 = no delay.
      required: [id, name, description, webrip, bluray, remux, brdisk, rawhd, hdtv]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        webrip:
          type: integer
        bluray:
          type: integer
        remux:
          type: integer
        brdisk:
          type: integer
        rawhd:
          type: integer
        hdtv:
          type: integer
    ReleaseProfile:
      type: object
      description: |
        Which release sources may be considered (Radarr R5a; Radarr's
        release profiles). Every flag defaults to true.
      required: [id, name, description, webrip, bluray, remux, brdisk, rawhd, hdtv]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        webrip:
          type: boolean
        bluray:
          type: boolean
        remux:
          type: boolean
        brdisk:
          type: boolean
        rawhd:
          type: boolean
        hdtv:
          type: boolean
    ProfilesSettings:
      type: object
      required: [profiles, movie_profiles, delay_profiles, release_profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/QualityProfile"
        movie_profiles:
          type: array
          description: |
            Radarr movie quality profiles (Radarr R5a). Seeded with the 14
            Radarr v6 defaults; profile ids live in a separate space from the
            TV profiles (100+). Items reference movie quality level ids.
          items:
            $ref: "#/components/schemas/QualityProfile"
        delay_profiles:
          type: array
          items:
            $ref: "#/components/schemas/DelayProfile"
        release_profiles:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseProfile"
    TagInfo:
      type: object
