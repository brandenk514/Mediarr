      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          description: Indexer protocol (fake, torznab, torrent-rss, nzb).
        base_url:
          type: string
        api_key:
          type: string
          description: Empty = keep the stored key (masked-edit round-trip).
        settings_json:
          type: string
          description: Empty = keep the stored settings.
    IndexerEnabled:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    IndexerTestResult:
      type: object
      required: [id, name, kind, base_url, enabled, ok, duration, at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
        base_url:
          type: string
        enabled:
          type: boolean
        ok:
          type: boolean
        error:
          type: string
          description: Credential-free failure reason (absent on success).
        duration:
          type: integer
          description: Probe duration in nanoseconds.
        at:
          type: string
          format: date-time
    IndexerStats:
      type: object
      required: [name, calls, successes, failures, last_success, last_error, last_latency_ns, avg_latency_ns, total_latency_ns]
      properties:
        name:
          type: string
        calls:
          type: integer
          format: int64
        successes:
          type: integer
          format: int64
        failures:
          type: integer
          format: int64
        last_success:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
        last_latency_ns:
          type: integer
          format: int64
        avg_latency_ns:
          type: integer
          format: int64
        total_latency_ns:
          type: integer
          format: int64
    DownloadClientView:
      type: object
      required: [kind, qb_base, qb_username, qb_api_key_set, qb_password_set, sab_base, sab_api_key_set, sab_complete_dir]
      properties:
        kind:
          type: string
          description: Download-client kind (mock, qbittorrent, sabnzbd).
        qb_base:
          type: string
        qb_username:
          type: string
        qb_api_key_set:
          type: boolean
        qb_password_set:
          type: boolean
        sab_base:
          type: string
        sab_api_key_set:
          type: boolean
        sab_complete_dir:
          type: string
    DownloadClientRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: Download-client kind (mock, qbittorrent, sabnzbd); omitted means mock.
        qb_base:
          type: string
        qb_username:
          type: string
        qb_api_key:
          type: string
          description: Empty = keep the stored value.
        qb_password:
          type: string
          description: Empty = keep the stored value.
        sab_base:
          type: string
        sab_api_key:
          type: string
          description: Empty = keep the stored value.
        sab_complete_dir:
          type: string
    LibraryOverride:
      type: object
      required: [path, quality_profile]
      properties:
        path:
          type: string
        quality_profile:
          type: string
        checksum_verify:
          type: boolean
          nullable: true
          description: Tristate — absent/null means use the default; false opts out, true opts in.
    LibraryOverrides:
      type: object
      description: All four libraries keyed by kind (movie, tv, music, book).
      additionalProperties:
        $ref: "#/components/schemas/LibraryOverride"
    SearchResult:
      type: object
      required: [id, title, year, extra]
      properties:
        id:
          type: string
          description: Provider id (tmdb_id / tvdb_id / mbid / open-library key).
        title:
          type: string
        year:
          type: integer
        extra:
          type: object
          description: Display-only detail per kind (overview+rating, country, author).
          additionalProperties:
            type: string
    ProfileKind:
      type: string
      enum: [movies, tv, music, books]
    ProfilesResponse:
      type: object
      required: [profiles, default]
      properties:
        profiles:
          type: array
          items:
            type: string
        default:
          type: string
    EventFrame:
      type: object
      required: [type, at]
      properties:
        type:
          type: string
          description: Frame type — hello, queue.updated, or history.appended.
        payload:
          $ref: "#/components/schemas/EventPayload"
        at:
          type: string
          format: date-time
    EventPayload:
      description: |
        Per-kind bus payloads. queue.updated and history.appended frames carry
        one of these; the id field identifies the kind (movie_id, series_id,
        artist_id, or author_id).
      oneOf:
        - $ref: "#/components/schemas/QueueUpdatedMovie"
        - $ref: "#/components/schemas/QueueUpdatedTV"
        - $ref: "#/components/schemas/QueueUpdatedMusic"
        - $ref: "#/components/schemas/QueueUpdatedBook"
        - $ref: "#/components/schemas/HistoryAppendedMovie"
        - $ref: "#/components/schemas/HistoryAppendedTV"
        - $ref: "#/components/schemas/HistoryAppendedMusic"
        - $ref: "#/components/schemas/HistoryAppendedBook"
    QueueUpdatedMovie:
      type: object
      required: [movie_id, queue_id, release_title, indexer, client, state, progress]
      properties:
        movie_id:
          type: integer
          format: int64
        queue_id:
          type: integer
          format: int64
        release_title:
          type: string
        indexer:
          type: string
        client:
          type: string
        state:
          $ref: "#/components/schemas/QueueState"
        progress:
          type: integer
    QueueUpdatedTV:
      type: object
      required: [series_id, queue_id, release_title, indexer, client, state, progress]
      properties:
        series_id:
          type: integer
          format: int64
        queue_id:
          type: integer
          format: int64
        release_title:
          type: string
        indexer:
          type: string
        client:
          type: string
        state:
          $ref: "#/components/schemas/QueueState"
        progress:
          type: integer
    QueueUpdatedMusic:
      type: object
      required: [artist_id, album_id, queue_id, release_title, indexer, client, state, progress]
      properties:
        artist_id:
          type: integer
          format: int64
        album_id:
          type: integer
          format: int64
        queue_id:
          type: integer
          format: int64
        release_title:
          type: string
        indexer:
          type: string
        client:
          type: string
        state:
          $ref: "#/components/schemas/QueueState"
        progress:
          type: integer
    QueueUpdatedBook:
      type: object
      required: [author_id, title_id, queue_id, release_title, indexer, client, state, progress]
      properties:
        author_id:
          type: integer
          format: int64
        title_id:
          type: integer
          format: int64
        queue_id:
          type: integer
          format: int64
        release_title:
          type: string
        indexer:
          type: string
        client:
          type: string
        state:
          $ref: "#/components/schemas/QueueState"
        progress:
          type: integer
    HistoryAppendedMovie:
      type: object
      required: [movie_id, event, detail]
      properties:
        movie_id:
          type: integer
          format: int64
        event:
          type: string
        detail:
          type: string
    HistoryAppendedTV:
      type: object
      required: [series_id, event, detail]
      properties:
        series_id:
          type: integer
          format: int64
        event:
          type: string
        detail:
          type: string
    HistoryAppendedMusic:
      type: object
      required: [artist_id, event, detail]
      properties:
        artist_id:
          type: integer
          format: int64
        event:
          type: string
        detail:
          type: string
    HistoryAppendedBook:
      type: object
      required: [author_id, event, detail]
      properties:
        author_id:
          type: integer
          format: int64
        event:
          type: string
