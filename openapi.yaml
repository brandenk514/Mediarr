        rename_series:
          type: boolean
    RemotePathMapping:
      type: object
      required: [source, destination]
      properties:
        source:
          type: string
        destination:
          type: string
    MediaManagementSettings:
      type: object
      required: [naming, file_management, remote_path_mappings]
      properties:
        naming:
          $ref: "#/components/schemas/NamingTemplate"
        file_management:
          $ref: "#/components/schemas/FileManagement"
        remote_path_mappings:
          type: array
          items:
            $ref: "#/components/schemas/RemotePathMapping"
    CFRule:
      type: object
      required: [field, operator, value]
      properties:
        field:
          type: string
          enum: [title, quality, source, kind, tag, size_mb]
        operator:
          type: string
          enum: [contains, not_contains, equals, regex, exists, gt, lt]
        value:
          type: string
    CustomFormat:
      type: object
      required: [id, name, enabled, score, rules]
      properties:
        id:
          type: integer
        name:
          type: string
        enabled:
          type: boolean
        score:
          type: integer
          description: Points added when every rule matches (may be negative to penalise).
        rules:
          type: array
          items:
            $ref: "#/components/schemas/CFRule"
    CustomFormatsSettings:
      type: object
      required: [formats]
      properties:
        formats:
          type: array
          items:
            $ref: "#/components/schemas/CustomFormat"
    CustomFormatScoreRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        quality:
          type: string
        source:
          type: string
        kind:
          type: string
        size_mb:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
    CustomFormatMatch:
      type: object
      required: [name, score]
      properties:
        name:
          type: string
        score:
          type: integer
    CustomFormatScoreResult:
      type: object
      required: [total, matches]
      properties:
        total:
          type: integer
        matches:
          type: array
          items:
            $ref: "#/components/schemas/CustomFormatMatch"
    NotificationOptions:
      type: object
      required: [url, section_id, token, token_set]
      properties:
        url:
          type: string
          description: Webhook URL, or the Plex / Jellyfin / Emby base URL.
        section_id:
          type: string
          description: Plex library-section id (Jellyfin/Emby refresh all when empty).
        token:
          type: string
          description: Write-only in practice — reads return an empty string and set token_set instead. Blank on write keeps the stored token.
        token_set:
          type: boolean
    Notification:
      type: object
      required: [id, name, kind, enabled, options]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum: [webhook, plex, jellyfin, emby]
        enabled:
          type: boolean
        options:
          $ref: "#/components/schemas/NotificationOptions"
    ConnectSettings:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
    ConnectTestRequest:
      type: object
      required: [id, kind, options]
      properties:
        id:
          type: integer
          description: Saved notification id; 0 = use the inline kind+options.
        kind:
          type: string
          enum: [webhook, plex, jellyfin, emby]
        options:
          $ref: "#/components/schemas/NotificationOptions"
        event:
          type: string
          description: Event type for the test dispatch. Defaults to test.
    ConnectTestResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
    MetadataSettings:
      type: object
      required: [generate_nfo, generate_subtitles, language, kinds]
      properties:
        generate_nfo:
          type: boolean
          description: Write .nfo sidecars on import / refresh (the metadata file writer).
        generate_subtitles:
          type: boolean
          description: Fetch sidecar subtitles on import (provider-dependent).
        language:
          type: string
          description: Default subtitle / metadata language code.
        kinds:
          type: object
          description: Per-kind enablement (movie / tv / music / book).
          additionalProperties:
            type: boolean
    MetadataSourceSettings:
      type: object
      description: |
        P5.7 per-kind source lists: the ordered provider chain for each
        library kind (keyed primary first, keyless fallbacks after). A
        source that is not configured (missing key) is skipped by the
        fallback chain, so zero-key installs still work through TVmaze,
        Wikidata, MusicBrainz and Open Library.
      required: [sources]
      properties:
        sources:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    MetadataSourceSearchRequest:
      type: object
      required: [kind, query]
      properties:
        kind:
          $ref: "#/components/schemas/MediaKind"
        query:
          type: string
    ProviderAttempt:
      type: object
      required: [source, ok, latency_ms, error]
      properties:
        source:
          type: string
        ok:
          type: boolean
        latency_ms:
          type: integer
          format: int64
        error:
          type: string
          description: empty string when ok.
    MetadataSourceSearchResult:
      type: object
      required: [kind, source, results, attempts]
      properties:
        kind:
          type: string
        source:
          type: string
          description: The provider that answered; empty string when every source failed.
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/ProviderAttempt"
    ImportList:
      type: object
      required: [id, name, kind, url, enabled, api_key, api_key_set]
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
          enum: [trakt, sonarr]
        url:
          type: string
          description: Trakt list URL, or the base URL of a Sonarr instance.
        enabled:
          type: boolean
        api_key:
          type: string
          description: Sonarr instance API key; write-only in practice (reads return empty string + api_key_set).
        api_key_set:
          type: boolean
    ImportListsSettings:
      type: object
      required: [lists]
      properties:
        lists:
          type: array
          items:
            $ref: "#/components/schemas/ImportList"
    ImportRunRequest:
      type: object
      required: [id, dry_run]
      properties:
        id:
          type: integer
          description: The import list to run.
        dry_run:
          type: boolean
    ImportRunItem:
      type: object
      required: [external_id, title, kind, status, message]
      properties:
        external_id:
          type: string
        title:
          type: string
        kind:
          type: string
          description: The library kind the item was (or would be) added to.
        status:
          type: string
          enum: [imported, exists, skipped, error]
        message:
          type: string
    ImportRunResult:
      type: object
      required: [dry_run, total, items]
      properties:
        dry_run:
          type: boolean
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportRunItem"
    # ---- System (P6) ----------------------------------------------------
    HealthCheck:
      type: object
      required: [check, message, severity, wiki_link]
      description: One row in the System > Status health table.
      properties:
        check:
          type: string
          description: Stable check id (postgres, redis, media_root, ...).
        message:
          type: string
          description: Human-readable status for the check.
        severity:
          type: string
          enum: [ok, warning, error]
        wiki_link:
          type: string
          description: Docs link for this check; empty when none.
    SystemHealth:
      type: object
      required: [checks, ok, warning, error]
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
        ok:
          type: integer
          description: Count of ok checks.
        warning:
          type: integer
          description: Count of warning checks.
        error:
          type: integer
          description: Count of error checks.
    TaskInfo:
      type: object
      required: [name, description, kind, running, enabled]
      description: One background task in the worker inventory.
      properties:
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [scheduled, on-demand, planned]
          description: scheduled = periodic worker; on-demand = manual probe; planned = in the PLAN.md §3 inventory but not yet implemented.
        interval:
          type: string
          description: Human schedule for scheduled tasks; empty otherwise.
        last_run:
          type: string
          format: date-time
          nullable: true
          description: When the task last ran; null when it never has.
        last_duration:
          type: string
          description: How long the last run took (e.g. 1.2s).
        last_error:
          type: string
          description: Error message from the last run; empty when clean.
        running:
          type: boolean
          description: True while the task is currently executing.
        enabled:
          type: boolean
          description: False for planned tasks that are not yet active.
    SystemTasks:
      type: object
      required: [tasks, running, scheduled]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskInfo"
        running:
          type: integer
          description: Number of tasks currently executing.
        scheduled:
          type: integer
          description: Number of active scheduled (periodic) tasks.
    DiskRoot:
      type: object
      required: [path, exists, total_bytes, used_bytes, free_bytes, usage_pct]
      properties:
        path:
          type: string
        exists:
          type: boolean
          description: False when the path is not present (usage fields are 0).
        total_bytes:
          type: integer
          format: int64
        used_bytes:
          type: integer
          format: int64
        free_bytes:
          type: integer
          format: int64
        usage_pct:
          type: number
          format: double
          description: used/total as a fraction 0..1; 0 when the path is absent.
    SystemDisk:
      type: object
      required: [roots, media_root, downloads_dir]
      properties:
        roots:
          type: array
          items:
            $ref: "#/components/schemas/DiskRoot"
        media_root:
          type: string
          description: The configured shared media root.
        downloads_dir:
          type: string
          description: The configured downloads dir.
    SystemAbout:
      type: object
      required: [version, commit, build_time, go_version, mode, started_at, uptime_seconds]
      properties:
        version:
          type: string
        commit:
          type: string
        build_time:
          type: string
        go_version:
          type: string
        mode:
          type: string
          description: Run mode (production | development).
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
          format: int64
        uptime:
          type: string
          description: Human uptime (e.g. 3h 12m).
    BackupSection:
      type: object
      required: [section, document]
      description: One settings section document in a backup.
      properties:
        section:
          type: string
          description: The section slug (e.g. import-lists, tags).
        document:
          type: string
          description: The raw section JSON, encoded as a JSON string.
    BackupSettings:
      type: object
      required: [download_client, libraries, sections]
      properties:
        download_client:
          $ref: "#/components/schemas/DownloadClientView"
        libraries:
          $ref: "#/components/schemas/LibraryOverrides"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/BackupSection"
    BackupDocument:
      type: object
      required: [version, exported_at, settings]
      description: A self-contained configuration backup.
      properties:
        version:
          type: string
          description: The mediarr build that exported this backup.
        exported_at:
          type: string
          format: date-time
        settings:
          $ref: "#/components/schemas/BackupSettings"
        queue:
          type: array
          nullable: true
          description: Optional queue snapshot; present only when include_queue.
          items:
            $ref: "#/components/schemas/QueueViewItem"
        series:
          type: array
          nullable: true
          description: Optional series snapshot; present only when include_series.
          items:
            $ref: "#/components/schemas/Series"
    BackupImportRequest:
      type: object
      required: [document, include_queue, include_series]
      properties:
        document:
          $ref: "#/components/schemas/BackupDocument"
        include_queue:
          type: boolean
          description: Import the queue snapshot (if present in the document).
        include_series:
          type: boolean
          description: Import the series snapshot (if present in the document).
    BackupImportResult:
      type: object
      required: [imported, settings_imported, queue_imported, series_imported]
      properties:
        imported:
          type: boolean
        settings_imported:
          type: integer
          description: Number of settings documents written.
        queue_imported:
          type: integer
        series_imported:
          type: integer
        message:
          type: string
    SystemEvents:
      type: object
      required: [events]
      description: The event log (the history source).
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/GlobalHistoryItem"
    ChangelogEntry:
      type: object
      required: [version, date, entries]
      properties:
        version:
          type: string
        date:
          type: string
          format: date
        entries:
          type: array
          items:
            type: string
    SystemUpdates:
      type: object
      required: [current, changelog]
      properties:
        current:
          type: string
          description: The running version (highlighted by the UI).
        changelog:
          type: array
          items:
            $ref: "#/components/schemas/ChangelogEntry"
    MigrationItem:
      type: object
      required: [entity, external_id, action]
      description: One migrated entity in the mapping report.
      properties:
        entity:
          type: string
          enum: [quality_profile, tag, indexer, download_client, series, episode]
        external_id:
          type: string
          description: Stable source key (Sonarr id or slug).
        source_title:
          type: string
        action:
          type: string
          enum: [created, exists, updated, skipped, error, dry-run]
        target_id:
          type: integer
          format: int64
          description: The Mediarr id the source mapped to (0 when not created).
        message:
          type: string
    MigrationCounts:
      type: object
      required: [total, created, existing, skipped, errors]
      properties:
        total:
          type: integer
        created:
          type: integer
        existing:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
    MigrationResult:
      type: object
      required: [dry_run, resume, counts, items, resumable]
      description: The mapping report for a migration run.
      properties:
        dry_run:
          type: boolean
        resume:
          type: boolean
        source_url:
          type: string
        counts:
          $ref: "#/components/schemas/MigrationCounts"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MigrationItem"
        resumable:
          type: boolean
          description: True when a partial run can be continued with resume.
    MigrationInclude:
      type: object
      description: Which entity classes to migrate; omitted fields default to true.
      properties:
        series:
          type: boolean
        episodes:
          type: boolean
        quality_profiles:
          type: boolean
        tags:
          type: boolean
        indexers:
          type: boolean
        download_client:
          type: boolean
    MigrationRequest:
      type: object
      required: [source_url, dry_run]
      properties:
        source_url:
          type: string
          description: Base URL of the Sonarr instance (e.g. http://sonarr.local:8989).
        api_key:
          type: string
          description: Sonarr API key (sent as X-Api-Key).
        dry_run:
          type: boolean
          description: Report only; add nothing.
        resume:
          type: boolean
          description: Resume a previously partial run (skips already-migrated series).
        include:
          $ref: "#/components/schemas/MigrationInclude"
    MigrationStatus:
      type: object
      required: [status, running, done, total]
      properties:
        status:
          type: string
          enum: [idle, running, completed, partial, failed]
        running:
          type: boolean
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        done:
          type: integer
          description: Number of series processed so far.
        total:
          type: integer
          description: Total series in the source (0 until a run completes the fetch).
        last_result:
          type: object
          nullable: true
          description: The last migration mapping report.
          additionalProperties: true
