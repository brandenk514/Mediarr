openapi: "3.0.3"
info:
  title: Mediarr API
  version: 1.0.0
  description: |
    The v1 HTTP API of mediarr, a four-library (movies / TV / music / books)
    download-and-import manager.

    ## Wire naming (important)

    The Go domain structs carry NO json tags, so `encoding/json` emits the
    *exact Go field names* on every library item: `ID`, `Title`, `Monitored`,
    `AddedAt`, ... Envelopes and API-only documents use snake_case json tags
    (`items`, `page_size`, `release_title`, ...). This spec mirrors the wire
    format verbatim — do NOT "clean up" names to camelCase.

    ## Nullability contract

    - Paginated list endpoints (`Page` envelope) always return `items` as a
      JSON array, never `null` (empty page = `[]`).
    - Dashboard arrays (`libraries`, `recent_history`, `recent_queue`,
      `indexers`) are always `[]`, never `null`.
    - Child collections (episodes, albums, tracks, titles, editions, wanted
      lists) and queue history events are `null` when empty — the repositories
      return a nil slice. Marked `nullable: true` below.
    - `Page` is not generic in OpenAPI: one schema per kind
      (`PageMovie`, `PageSeries`, `PageArtist`, `PageAuthor`, `PageQueueItem`).

    ## Live events

    `/api/v1/events` is a hand-rolled WebSocket (not part of the generated
    client). Its frame and per-kind payload types are declared under
    `components.schemas` (`EventFrame`, `QueueUpdated*`, `HistoryAppended*`)
    so TS consumers can import them.
servers:
  - url: http://localhost:8080
    description: Default local development endpoint (MEDIARR_HTTP_ADDR :8080)
security:
  - bearerAuth: []
tags:
  - name: ops
    description: Process liveness / readiness / build info (no auth).
  - name: auth
    description: Login and current-user.
  - name: movies
    description: Movies library (add, list, get, monitor, pipeline).
  - name: tv
    description: TV library (series, episodes, seasons, wanted, pipeline).
  - name: root-folders
    description: Root-folder registry (on-disk media roots for Add-New and Library Import).
  - name: music
    description: Music library (artists, albums, tracks, wanted, pipeline).
  - name: books
    description: Books library (authors, titles, editions, wanted, pipeline).
  - name: indexers
    description: Indexer definitions, on-demand tests, health stats.
  - name: settings
    description: Download-client config and per-library overrides.
  - name: dashboard
    description: Cross-library overview.
  - name: queue
    description: Full download/import queue and per-parent history.
  - name: history
    description: Global event feed across all libraries (Activity > History).
  - name: blocklist
    description: Blocked/rejected releases (Activity > Blocklist).
  - name: wanted
    description: Global wanted episodes — Missing + Cutoff Unmet (Wanted page).
  - name: import
    description: Manual import of a wanted episode from a local file.
  - name: calendar
    description: Upcoming monitored air dates (Calendar page + iCal feed).
  - name: search
    description: Provider search for the add flows + quality profiles.
  - name: events
    description: Live WebSocket push of queue/history events.
  - name: metrics
    description: Prometheus scrape endpoint.
paths:
  /healthz:
    get:
      tags: [ops]
      summary: Liveness probe.
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: The process is alive. Body carries build info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /readyz:
    get:
      tags: [ops]
      summary: Readiness probe (pings Postgres + Redis).
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: All dependency checks passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
        "503":
          description: One or more dependency checks failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessReport"
  /version:
    get:
      tags: [ops]
      summary: Build info.
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Build info for the running binary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in and mint an API token.
      operationId: login
      security: []
      description: |
        First boot: if no user exists yet, the first successful login creates
        the initial admin (username 3-32 chars of [A-Za-z0-9_-], password of
        at least 10 chars). All other auth failures return a uniform 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token minted (the raw token is shown once).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials (uniform for all auth failures).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user.
      operationId: me
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/movies:
    get:
      tags: [movies]
      summary: List movies (server-side filtered + paginated).
      operationId: listMovies
      parameters:
        - $ref: "#/components/parameters/ListQ"
        - $ref: "#/components/parameters/ListMonitored"
        - $ref: "#/components/parameters/ListPage"
        - $ref: "#/components/parameters/ListPageSize"
      responses:
        "200":
          description: One page of movies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMovie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [movies]
      summary: Add a movie.
      operationId: addMovie
      description: Creates the movie and a pending wanted row. Duplicate (title, year) is a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMovieRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/movies/{id}:
    get:
      tags: [movies]
      summary: Get one movie.
      operationId: getMovie
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: The movie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [movies]
      summary: Toggle movie monitoring.
      operationId: setMovieMonitored
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMonitored"
      responses:
        "200":
          description: The toggled state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoredResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/movies/{id}/pipeline:
    post:
      tags: [movies]
      summary: Run the movie pipeline (search, match, download, import).
      operationId: runMoviePipeline
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Import result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: No release matched the wanted request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/tv:
    get:
      tags: [tv]
      summary: List series (server-side filtered + paginated).
      operationId: listSeries
      parameters:
        - $ref: "#/components/parameters/ListQ"
        - $ref: "#/components/parameters/ListMonitored"
        - $ref: "#/components/parameters/ListPage"
        - $ref: "#/components/parameters/ListPageSize"
      responses:
        "200":
          description: One page of series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSeries"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [tv]
      summary: Add a series.
      operationId: addSeries
      description: |
        A series is monitored by default; an explicit false opts out.
        tvdb_id / tmdb_id carry the provider ids of the selected search
        result (omitted = 0 on the server).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSeriesRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/tv/{id}:
    get:
      tags: [tv]
      summary: Get one series.
      operationId: getSeries
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [tv]
      summary: Toggle series-level monitoring (fans out to known episodes).
      operationId: setSeriesMonitored
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMonitored"
      responses:
        "200":
          description: The toggled state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoredResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      tags: [tv]
      summary: "Update a series (P2: quality profile, series type, season folder, tags, monitored)."
      operationId: updateSeries
      description: |
        Partial update: only the fields present in the body change; omitted
        fields keep their current values. A monitored change fans out to
        known episodes, like the PUT toggle.
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSeriesRequest"
      responses:
        "200":
          description: The updated series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/tv/{id}/seasons/{season}:
    put:
      tags: [tv]
      summary: Toggle a season's monitoring.
      operationId: setSeasonMonitored
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/PathSeason"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMonitored"
      responses:
        "200":
          description: The toggled state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonMonitoredResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/tv/{id}/episodes:
    get:
      tags: [tv]
      summary: List a series' episodes.
      operationId: listEpisodes
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: The episodes, or null when the series has none.
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: "#/components/schemas/Episode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [tv]
      summary: Add an episode to a series.
      operationId: addEpisode
      description: A new episode is monitored by default; an explicit false opts out.
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddEpisodeRequest"
      responses:
        "201":
          description: Created (empty body).
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/tv/{id}/episodes/{season}/{episode}:
    put:
      tags: [tv]
      summary: Toggle one episode's monitoring.
      operationId: setEpisodeMonitored
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/PathSeason"
        - $ref: "#/components/parameters/PathEpisode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMonitored"
      responses:
        "200":
          description: The toggled state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeMonitoredResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/tv/{id}/episodes/search:
    post:
      tags: [tv]
      summary: Start a search for the series' missing monitored episodes (P2).
      operationId: searchMissingEpisodes
      description: |
        Marks every monitored episode that is not yet satisfied as wanted
        (creating the wanted row if needed) so the next pipeline run fetches
        it. Returns how many episodes are now searched.
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: The number of episodes now searched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesSearchResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/tv/{id}/history:
    get:
      tags: [tv]
      summary: List a series' history (P2).
      operationId: listSeriesHistory
      parameters:
        - $ref: "#/components/parameters/PathID"
        - $ref: "#/components/parameters/HistoryLimit"
      responses:
        "200":
          description: The series' history entries, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/tv/import:
    post:
      tags: [tv]
      summary: Scan a root folder for series and match it to the library (P2, phase 1).
      operationId: importLibrary
      description: |
        Library import, phase 1 (scan -> match -> confirm): scans the given
        root folder, treats each immediate subfolder as a candidate series
        (parsed as "Title (Year)"), counts its seasons and video files, and
        reports which candidates match a tracked series. Confirmation of an
        import happens through the regular add-series flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: The scan report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        "400":
          description: Bad request (missing root, not a directory, invalid JSON).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The root folder does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/tv/{id}/wanted:
    get:
      tags: [tv]
      summary: List a series' wanted episodes.
      operationId: listSeriesWanted
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: The wanted rows, or null when none.
          content:
            application/json:
              schema:
                type: array
                nullable: true
                items:
                  $ref: "#/components/schemas/SeriesWanted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/tv/{id}/pipeline:
    post:
      tags: [tv]
      summary: Run the TV pipeline.
      operationId: runTVPipeline
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Import result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedResult"
        "204":
          description: Nothing to do (no pending wanted episodes).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: No release matched the wanted request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/root-folders:
    get:
      tags: [root-folders]
      summary: List registered root folders.
      operationId: listRootFolders
      responses:
        "200":
          description: All registered root folders, by id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RootFolder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [root-folders]
      summary: Register a root folder.
      operationId: addRootFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootFolderRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/root-folders/{id}:
    put:
      tags: [root-folders]
      summary: Update a root folder.
      operationId: updateRootFolder
      description: Omitted path/name keep their stored values.
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootFolderRequest"
      responses:
        "200":
          description: The updated root folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootFolder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      tags: [root-folders]
      summary: Delete a root folder.
      operationId: deleteRootFolder
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Deleted (empty body).
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/music/artists:
    get:
      tags: [music]
      summary: List artists (server-side filtered + paginated).
      operationId: listArtists
      parameters:
        - $ref: "#/components/parameters/ListQ"
        - $ref: "#/components/parameters/ListMonitored"
        - $ref: "#/components/parameters/ListPage"
        - $ref: "#/components/parameters/ListPageSize"
      responses:
        "200":
          description: One page of artists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageArtist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      tags: [music]
      summary: Add an artist.
      operationId: addArtist
      description: |
        An artist is monitored by default; an explicit false opts out.
        mbid is the MusicBrainz artist id of a selected search result
        (omitted = unset).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddArtistRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/music/artists/{id}:
    get:
      tags: [music]
      summary: Get one artist.
      operationId: getArtist
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: The artist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [music]
      summary: Toggle artist-level monitoring (fans out to known albums).
      operationId: setArtistMonitored
      parameters:
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMonitored"
      responses:
        "200":
          description: The toggled state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoredResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
  /api/v1/music/artists/{id}/albums:
    get:
      tags: [music]
      summary: List an artist's albums.
      operationId: listAlbums
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: The albums, or null when the artist has none.
          content:
