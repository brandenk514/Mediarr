        client. Auth is a bearer token like the REST API, or a token query
        parameter (browsers cannot set headers on a WebSocket handshake).

        The first frame is a hello handshake (payload omitted). Subsequent
        frames carry bus events — queue.updated and history.appended — with
        per-kind payloads declared under components.schemas (QueueUpdated*
        and HistoryAppended*).
      parameters:
        - name: token
          in: query
          required: false
          description: API token (alternative to the Authorization header).
          schema:
            type: string
      responses:
        "101":
          description: WebSocket upgrade (JSON frames per EventFrame).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventFrame"
        "401":
          description: Missing or invalid token (before upgrade).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus scrape (auth-gated).
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API token minted by POST /api/v1/auth/login.
  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PathSeason:
      name: season
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PathEpisode:
      name: episode
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PathDisc:
      name: disc
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PathNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ListQ:
      name: q
      in: query
      required: false
      description: Case-insensitive substring search on the item name.
      schema:
        type: string
    ListMonitored:
      name: monitored
      in: query
      required: false
      description: When set (true or false), keep only items whose monitored flag matches.
      schema:
        type: boolean
    ListPage:
      name: page
      in: query
      required: false
      description: 1-based page number (default 1).
      schema:
        type: integer
        minimum: 1
    ListPageSize:
      name: page_size
      in: query
      required: false
      description: Page size (default 25, max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
    SearchQuery:
      name: query
      in: query
      required: true
      description: Free-text search query.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid input (bad JSON, missing field, bad path/query value).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Duplicate resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Upstream provider returned a bad answer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Provider not configured (missing API key).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
