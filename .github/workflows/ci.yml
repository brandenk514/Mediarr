name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  # Manual run for the release pipeline. dry_run=true does the full build,
  # scan, SBOM and release-notes generation WITHOUT publishing anything —
  # the documented dry-run for #48. See RELEASE.md.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + scan + generate release notes only; do not publish or create a release'
        type: boolean
        default: true

# Only one concurrent CI run per branch. Manual dispatch runs are keyed by
# run id so a dry run can never cancel (or be cancelled by) a real
# main-branch build.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && format('run-{0}', github.run_id) || github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN scopes: read the contents, write ghcr packages, and keep
# id-token: write for a future keyless (Fulcio/OIDC) signing path. v0.1.0
# signs with the repo's release key instead (docs/cosign.pub + the
# COSIGN_KEY/COSIGN_PASSWORD secrets), because account-level OpenID
# Connect is not enabled, so an id-token: write request is dropped.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  GO_VERSION: '1.27.4'

jobs:
  # ------------------------------------------------------------------ verify
  ui:
    name: UI — build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Separate job from the Go pipeline (PLAN §12: `ui/` "separate build";
    # issue #39). The SPA is a standalone Vite/React/TypeScript app; its
    # artifact is built and (later, M7) served by the service.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      # Lockstep gate (M8 #79): ui/src/api/types.gen.ts must be a pure
      # function of openapi.yaml. Regenerate in CI and fail the build with
      # the fix command when it isn't, so spec and code can't drift
      # (docs/openapi.md).
      - name: OpenAPI lockstep (regenerate + diff)
        working-directory: ui
        run: |
          npm run generate
          if ! git diff --exit-code -- src/api/types.gen.ts; then
            echo "::error::ui/src/api/types.gen.ts is out of date with openapi.yaml. Run 'make generate' (or 'npm run generate' in ui/) and commit the regenerated file."
            git diff -- src/api/types.gen.ts | head -100
            exit 1
          fi

      # Fail the build on high/critical advisories in the npm tree. An
      # advisory that genuinely doesn't apply can be allowlisted here with
      # a comment explaining why.
      - name: Dependency audit
        working-directory: ui
        run: npm audit --audit-level=high

      - name: Type-check + build
        working-directory: ui
        run: npm run build

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Test
        working-directory: ui
        run: npm run test

  lint-and-test:
    name: Lint, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres (and Redis) for the integration tests are provisioned per-test
    # via testcontainers (internal/postgres/*_integration_test.go,
    # internal/auth/integration_test.go). We deliberately do NOT declare a
    # services: block here: the runner pulls those images *before any step
    # runs*, and that anonymous pull intermittently hit Docker Hub's
    # 100-pull/6h rate limit ("toomanyrequests"), failing the job before a
    # single test ran.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      # Spec validity (M8 #76): openapi.yaml is the wire-contract source of
      # truth, so a malformed spec fails every PR that touches it.
      - name: OpenAPI spec check
        run: go run ./tools/speccheck

      - name: golangci-lint
        # Pinned: linter behavior changes between versions, and this gate's
        # rules (gosec/errcheck/govet/unused, see .golangci.yml) must be
        # deterministic. Bump deliberately and review the new findings.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Unit tests
        run: |
          set -euo pipefail
          # Pure (no Docker / DSN / network) unit tests across every domain,
          # service, and supporting package. domains/ and services/ were
          # previously only covered by `make test`, not the CI gate — the
          # #22 smoke-test route regression would have slipped through.
          # downloads/ (qBittorrent #36, SABnzbd #37) is pure: its adapter
          # tests run against in-process httptest stubs, not real services.
          go test ./internal/api/... ./internal/auth/... ./internal/config/... \
            ./internal/health/... ./internal/domains/... ./internal/services/... \
            ./internal/secrets/... ./internal/indexers/... ./internal/downloads/... \
            ./internal/paging/... \
            -count=1 -cover -coverprofile=unit.coverage.out
          go tool cover -func unit.coverage.out | tail -1

          # Enforce the overall coverage floor (PLAN §10: >= 60% overall).
          # The per-package 80% target for domain/ and services/ is reported
          # below but is NOT yet a hard gate: domains/movies (66%) and
          # services/movies (67%) are still climbing to it — promote those
          # to a hard gate once they land (tracked as a follow-up).
          total=$(go tool cover -func unit.coverage.out | awk '/^total/ {gsub("%","",$3); print $3}')
          if awk -v v="${total:-0}" 'BEGIN { exit !(v < 60) }'; then
            echo "FAIL: overall unit coverage ${total}% is below the 60% floor (PLAN §10)" >&2
            exit 1
          fi
          echo "overall unit coverage: ${total}% (floor 60%) — per-package (target 80%):"
          for pkg in $(go list ./internal/domains/... ./internal/services/...); do
            go test -covermode=atomic -coverpkg="$pkg" -coverprofile=cov.out "$pkg" -count=1 >/dev/null
            pct=$(go tool cover -func cov.out | awk '/^total/ {print $3}')
            printf '  %-55s %s\n' "$pkg" "$pct"
          done
          rm -f cov.out

      # Docker Hub auth (if DOCKERHUB_TOKEN is set) so the testcontainers
      # pull of postgres:16-alpine is not anonymous.
      - name: Log in to Docker Hub (if configured)
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Integration tests (Postgres + Redis)
        run: go test ./internal/postgres/... ./internal/auth/... -count=1 -timeout 300s

      # End-to-end pipeline tests (issue #38): the full movie flow — search →
      # parse → quality/profile match → send to a *real* download client
      # (qBittorrent / SABnzbd adapters, built through the config-driven
      # downloads.NewClient factory) → import — against real Postgres
      # persistence and a real Redis pub/sub queue bus. The remote torrent /
      # NZB servers are stubbed in-process over HTTP. Like the integration
      # tests above, these use testcontainers (Docker is already
      # authenticated for the image pulls), so they run here, not in the pure
      # unit-test step.
      - name: E2E pipeline tests (real qBittorrent + SABnzbd clients)
        run: go test ./test/e2e/... -count=1 -timeout 300s

  # ---------------------------------------------------------------- security
  # Semgrep static analysis gate (M7 #49): Go + TypeScript rulesets from the
  # public registry, pinned binary, hard-fail on any finding. govulncheck
  # (above) covers Go dependency vulns; Trivy (docker job) covers the image.
  semgrep:
    name: Security — Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Semgrep (pinned)
        run: pip install --quiet "semgrep==1.181.0"

      - name: Semgrep scan (Go + TypeScript)
        run: semgrep scan --config p/golang --config p/typescript --error

  # ------------------------------------------------------------------- load
  # Load test (M7 #45): 10k items in the DB, p95 read latency at concurrency
  # 10, sustained import through the pipeline, and a memory ceiling. Runs as
  # its own job so the ~2-4 minute scenario doesn't slow the PR feedback loop;
  # the thresholds it asserts on are documented in docs/loadtest.md.
  load:
    name: Load test (10k items)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Docker Hub auth (if DOCKERHUB_TOKEN is set) so the testcontainers
      # pulls of postgres/redis are not anonymous.
      - name: Log in to Docker Hub (if configured)
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Load harness (seed 10k, latency, sustained import, RSS)
        run: go test ./test/loadtest/... -count=1 -timeout 600s -v

  # ------------------------------------------------------------------- build
  docker:
    name: Build + scan image
    # Gate the image on BOTH the Go pipeline and the UI job: a broken UI
    # build must never ship inside a published image.
    needs: [lint-and-test, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Version tag + publish decision.
      #   push to main          -> sha-<short>, publish (test image)
      #   push to tag vX.Y.Z    -> vX.Y.Z, publish + promote :latest
      #   pull_request          -> sha-<short>, no publish (scan/SBOM only)
      #   workflow_dispatch     -> sha-<short>; dry_run=true publishes nothing
      - name: Compute version
        id: ver
        run: |
          tag=sha-$(git rev-parse --short HEAD)
          publish=no
          latest=no
          case "${{ github.event_name }}" in
            push)
              publish=yes
              if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                tag="${GITHUB_REF#refs/tags/}"
                latest=yes
              elif [[ "${{ github.ref }}" != refs/heads/main ]]; then
                publish=no
              fi
              ;;
            workflow_dispatch)
              if [ "${{ inputs.dry_run }}" = "true" ]; then
                echo "DRY RUN: build + scan + SBOM + notes only — no publish, no signing, no release."
              else
                publish=yes
              fi
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # Docker Hub auth (if DOCKERHUB_TOKEN is set) so the golang
      # base-image pull during the build is not anonymous.
      - name: Log in to Docker Hub (if configured)
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Always build locally (single-arch, loaded into the daemon) so the
      # Trivy scan and SBOM have an image to read. No registry push on PRs.
      - name: Build image (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            VERSION=${{ steps.ver.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: mediarr:${{ steps.ver.outputs.tag }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mediarr:${{ steps.ver.outputs.tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: SBOM (trivy SPDX)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mediarr:${{ steps.ver.outputs.tag }}
          format: spdx-json
          output: mediarr-sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: mediarr-sbom
          path: mediarr-sbom.spdx.json

      # Publish multi-arch to ghcr only on trusted events (main + release tags).
      - name: Log in to ghcr
        if: steps.ver.outputs.publish == 'yes'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image to ghcr
        if: steps.ver.outputs.publish == 'yes'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ver.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: ghcr.io/brandenk514/mediarr:${{ steps.ver.outputs.tag }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sigstore/cosign signing with the repo's release key (docs/cosign.pub;
      # private key lives in the COSIGN_KEY/COSIGN_PASSWORD repo secrets), per
      # #48: a published image is signed, not just scanned. Verify follows
      # immediately against the committed public key so a broken signature
      # never publishes silently. (Keyless/Fulcio signing would need account-
      # level OpenID Connect, which this account does not have; id-token:
      # write stays in the permissions block for that future path.)
      # The archived sigstore/cosign-action repo is gone from GitHub, so we
      # use the official cosign binary (pinned).
      - name: Install cosign
        if: steps.ver.outputs.publish == 'yes'
        run: |
          COSIGN_VERSION="v3.1.3"
          curl -fsSL -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sign image (key)
        if: steps.ver.outputs.publish == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_KEY_B64: ${{ secrets.COSIGN_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          echo "${COSIGN_KEY_B64}" | base64 -d > "$RUNNER_TEMP/cosign.key"
          chmod 400 "$RUNNER_TEMP/cosign.key"
          cosign sign \
            --key "$RUNNER_TEMP/cosign.key" \
            --registry-username "${GITHUB_ACTOR}" \
            --registry-password "${GITHUB_TOKEN}" \
            --tlog-upload=true \
            "ghcr.io/brandenk514/mediarr:${{ steps.ver.outputs.tag }}"

      - name: Verify signature
        if: steps.ver.outputs.publish == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify \
            --key docs/cosign.pub \
            --registry-username "${GITHUB_ACTOR}" \
            --registry-password "${GITHUB_TOKEN}" \
            "ghcr.io/brandenk514/mediarr:${{ steps.ver.outputs.tag }}"

      # Promote the tagged image to :latest (manifest-list update only —
      # no rebuild, per PLAN §11 "on tag: promote to :latest").
      - name: Promote tag to :latest
        if: steps.ver.outputs.latest == 'yes'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/brandenk514/mediarr:latest \
            ghcr.io/brandenk514/mediarr:${{ steps.ver.outputs.tag }}
          echo "promoted ghcr.io/brandenk514/mediarr:${{ steps.ver.outputs.tag }} -> :latest"

  # ------------------------------------------------------------------- smoke
  smoke:
    name: Docker smoke test
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Docker Hub auth (if DOCKERHUB_TOKEN is set) so compose's pull of
      # postgres/redis is not anonymous.
      - name: Log in to Docker Hub (if configured)
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run the image against real Postgres + Redis
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.dev.yml up -d --build
          # Wait for readiness.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "=== /healthz ==="
          curl -fsS http://localhost:8080/healthz
          echo
          echo "=== /readyz ==="
          curl -fsS http://localhost:8080/readyz
          echo
          echo "=== /version ==="
          curl -fsS http://localhost:8080/version
          echo
          # UI-surface probes (issue #90): the served SPA, a deep link, a
          # hashed asset, and the reserved API routes. Same script the
          # pull_request ui-e2e job runs, so push and PR assert one surface.
          # (Push-only: on a PR this job is skipped, which is expected — the
          # ui-e2e job carries these probes for the PR build.)
          BASE_URL=http://localhost:8080 scripts/ui-smoke.sh
          docker compose -f deploy/compose.dev.yml down --remove-orphans

  # ------------------------------------------------------------- e2e (PR)
  # Browser-grade verification of the containerized UI (issue #90). Runs on
  # pull_request ONLY: it builds the PR-local image locally (on pull_request
  # the sha-<short> ghcr tag is never published, so this job must not pull any
  # registry image for the app), serves it on an ISOLATED ephemeral compose
  # stack (deploy/compose.ci.yml, project `mediarr-ci` — distinct from the
  # local mediarr-dev project and its volumes), seeds the first-boot admin,
  # and runs the Playwright subset that signs in through the REAL login form
  # and navigates the dashboard + per-kind pages. The push-only `smoke` job
  # above keeps its trigger; tag and workflow_dispatch(dry_run) behavior is
  # unchanged (this job never runs on them).
  ui-e2e:
    name: UI E2E — Playwright on the PR-local compose stack
    # Gate on the UI + Go pipelines: a PR that is already red there should
    # not spend 25 minutes on a browser stack. Mirrors the `docker` job's
    # needs. This job builds its own image, so it does NOT need `docker`.
    needs: [lint-and-test, ui]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU (buildx)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same tag derivation as the `docker` job: the runner has git, the
      # build context does not (.dockerignore strips .git), and a shell-style
      # `$(…)` in a build-arg is never evaluated by the Actions runner — it
      # reaches the image build where it can corrupt the go build (the first
      # scratch run of #90 died in `go tool link` over this). Compute the
      # tag here, on the runner, and pass the already-evaluated value.
      - name: Compute version
        id: ver
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The PR-local image: single-arch, loaded into the daemon, NOT pushed.
      # Same build-args and gha cache namespace as the `docker` job, so the
      # expensive layers (go mod, npm ci) are shared.
      - name: Build PR-local image (single-arch, no publish)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            VERSION=${{ steps.ver.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: mediarr:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Node 22 + Chromium (same toolchain the `ui` job uses; standard
      # Playwright browser install — no new npm dependency).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps + Chromium
        working-directory: ui
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Disposable first-boot admin for the ephemeral stack. Plain env
      # defaults (NOT a secret): the user exists only inside this throwaway
      # stack and is destroyed with its volumes on teardown (see
      # deploy/compose.ci.yml and the PR body). E2E_USER/E2E_PASSWORD stay
      # env-overridable, as consumed by ui/e2e/login.ts.
      - name: Run browser E2E against the isolated compose stack
        env:
          E2E_BASE_URL: http://localhost:8080
          BASE_URL: http://localhost:8080
          E2E_USER: admin
          E2E_PASSWORD: mediarr-dev123
        run: |
          set -euo pipefail
          # Guaranteed cleanup on ANY exit (success or failure): the trap
          # tears down the project and its volumes. A second `if: always()`
          # step below is the safety net for step timeout/cancel.
          teardown() { docker compose -f deploy/compose.ci.yml down -v --remove-orphans || true; }
          trap teardown EXIT

          docker compose -f deploy/compose.ci.yml up -d

          # Wait for readiness (ready once postgres + redis are healthy and
          # the app has booted).
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/readyz >/dev/null 2>&1; then break; fi
            if [ "$i" -eq 90 ]; then
              docker compose -f deploy/compose.ci.yml logs || true
              exit 1
            fi
            sleep 2
          done

          # Seed the first-boot admin (README first-boot pattern): the first
          # POST /api/v1/auth/login on an empty users table mints the admin.
          curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${E2E_USER}\",\"password\":\"${E2E_PASSWORD}\"}"
          echo

          # UI-surface probes (the same script the push `smoke` job runs):
          # SPA root, deep link, hashed asset, reserved API routes.
          scripts/ui-smoke.sh

          # The focused browser subset: real login form -> dashboard renders
          # -> each per-kind page loads without unhandled errors. (The full
          # 20-spec suite remains the local/manual bar; this keeps PR
          # feedback fast per the issue's scope.)
          (cd ui && npx playwright test e2e/container-ui.spec.ts)

      # Safety-net teardown: `if: always()` so a step timeout/cancel still
      # leaves zero containers/ports/volumes. Idempotent (the trap above may
      # have already run it) and prints what (should be nothing) is left.
      - name: "Teardown (always): remove stack + volumes"
        if: always()
        run: |
          set -uo pipefail
          docker compose -f deploy/compose.ci.yml down -v --remove-orphans || true
          echo "=== leftover containers (expect none) ==="
          docker ps -a --filter "label=com.docker.compose.project=mediarr-ci" --format '{{.Names}}' || true
          echo "=== leftover volumes (expect none) ==="
          docker volume ls --filter "name=mediarr-ci_" --format '{{.Name}}' || true

  # ------------------------------------------------------------- release
  release-notes:
    name: Generate release notes
    needs: [docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # #48: release notes are generated from the milestone's closed issues —
      # every issue number referenced by a commit subject in this tag's range
      # is fetched and rendered, in number order.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-notes.sh "${GITHUB_REF#refs/tags/}" > release-notes.md
      - name: Show generated notes
        run: cat release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --latest
          echo "release $TAG created"
