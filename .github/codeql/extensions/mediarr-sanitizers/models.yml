# Data extensions for go/path-injection (issue #111).
#
# Declares Mediarr's genuine path sanitizers as barriers: taint stops at the
# modeled function's return value, so paths that only reach the filesystem
# sinks after passing through one of these functions are no longer flagged.
#
# Row shape is codeql/go-all's barrierModel extensible predicate
# (go/ql/lib/semmle/go/dataflow/internal/ExternalFlowExtensions.qll):
#
#   [package, type, subtypes, name, signature, ext, output, kind, provenance]
#
# - type "" / subtypes false: plain (non-method) package-level functions
# - signature "" / ext "": always empty for Go
# - output "ReturnValue": the returned value is sanitized
# - kind "path-injection": matches the go/path-injection query kind
# - provenance "manual": hand-written (not generated by the model editor)
extensions:
  - addsTo:
      pack: codeql/go-all
      extensible: barrierModel
    data:
      # fsutil.ResolveConfined: cleans the input, roots relative paths at the
      # media root, and rejects out-of-root, "..", and symlink escapes,
      # returning the confined path or an error.
      - ["github.com/brandenk514/mediarr/internal/fsutil", "", false, "ResolveConfined", "", "", "ReturnValue", "path-injection", "manual"]
      # domains/music.cleanPathSegment: strips "/", "\", NUL, and control
      # characters; the result is a single safe path component.
      - ["github.com/brandenk514/mediarr/internal/domains/music", "", false, "cleanPathSegment", "", "", "ReturnValue", "path-injection", "manual"]
      # api.grabFileName: maps the path/OS-injection set ( / \ : * ? " < > |)
      # to "_"; no separators survive.
      - ["github.com/brandenk514/mediarr/internal/api", "", false, "grabFileName", "", "", "ReturnValue", "path-injection", "manual"]
      # services/music.fileNameFor: replaces every "." (so a ".." element is
      # impossible) and collapses whitespace; derives a safe download-client
      # file name.
      - ["github.com/brandenk514/mediarr/internal/services/music", "", false, "fileNameFor", "", "", "ReturnValue", "path-injection", "manual"]
      # services/tv.fileNameFor: same shape (replaces every ".").
      - ["github.com/brandenk514/mediarr/internal/services/tv", "", false, "fileNameFor", "", "", "ReturnValue", "path-injection", "manual"]
      # services/books.fileNameFor: same shape (replaces every ".").
      - ["github.com/brandenk514/mediarr/internal/services/books", "", false, "fileNameFor", "", "", "ReturnValue", "path-injection", "manual"]
      # services/movies.fileNameFor: same shape (replaces every ".").
      - ["github.com/brandenk514/mediarr/internal/services/movies", "", false, "fileNameFor", "", "", "ReturnValue", "path-injection", "manual"]
