{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mediarr.fullname" . }}
  labels:
    {{- include "mediarr.labels" . | nindent 4 }}
type: Opaque
stringData:
  MEDIARR_POSTGRES_DSN: {{ include "mediarr.pgDsn" . | quote }}
  MEDIARR_REDIS_URL: {{ include "mediarr.redisUrl" . | quote }}
  MEDIARR_ENCRYPTION_KEY: {{ required "secrets.encryptionKey (64 hex chars) is required unless existingSecret is set" .Values.secrets.encryptionKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
{{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
{{- end }}
{{- end }}
