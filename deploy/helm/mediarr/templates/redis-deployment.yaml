{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mediarr.fullname" . }}-redis
  labels:
    {{- include "mediarr.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "mediarr.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      # redis-server runs directly as the redis user (uid 999): no entrypoint
      # privilege drop, so a read-only rootfs is safe.
      securityContext:
        {{- include "mediarr.podSecurityContext" . | nindent 8 }}
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "mediarr.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          {{- if .Values.secrets.redisPassword }}
          command: ["sh", "-c"]
          args:
            - 'exec redis-server --requirepass "$REDIS_PASSWORD"'
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | default (include "mediarr.fullname" .) }}
                  key: REDIS_PASSWORD
          {{- end }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            {{- if .Values.secrets.redisPassword }}
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping']
            {{- else }}
            exec:
              command: ["redis-cli", "ping"]
            {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            {{- if .Values.secrets.redisPassword }}
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping']
            {{- else }}
            exec:
              command: ["redis-cli", "ping"]
            {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.redis.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mediarr.fullname" . }}-redis
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
