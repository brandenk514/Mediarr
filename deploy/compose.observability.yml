# Observability add-on for the Mediarr dev stack (M7 #46).
#
# Usage (same compose project as the dev stack, so Prometheus can reach the
# API over the shared network):
#
#   # 1. Get an API token (single-user v1) and save it to deploy/prometheus/mediarr-token
#   # 2. docker compose -f deploy/compose.dev.yml -f deploy/compose.observability.yml up --build
#
# Then:
#   Prometheus  http://localhost:9090   (alerts tab shows deploy/prometheus/rules.yml)
#   Grafana     http://localhost:3000   (admin / admin)
#
# Grafana setup:
#   1. Configuration → Data sources → Add Prometheus → http://prometheus:9090
#   2. Dashboards → Import → upload deploy/grafana/mediarr-dashboard.json
#      (it references the ${DS_PROMETHEUS} template variable; pick your source)

name: mediarr-dev

services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      # Relative to this file's directory (deploy/).
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      # Create this file first: the API token (POST /api/v1/auth/login).
      - ./prometheus/mediarr-token:/etc/prometheus/secrets/mediarr-token:ro
      - promdata:/prometheus
    depends_on:
      - mediarr
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  promdata:
  grafana:
